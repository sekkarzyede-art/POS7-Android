
name: Validate Tab2 R345 storage and backup integration (no APK)
on:
  push:
    branches: [fix/tab2-r345-parity-storage]
    paths: ['.github/workflows/r345-tab2-storage-validation.yml', 'pos7-release-audit/r345/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        branch: [tab2]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare restored-backup transfer sources
        run: python3 pos7-release-audit/r305/build_sources.py
      - name: Apply R324 safe accounting boot patch
        run: python3 pos7-release-audit/r319/optimize_boot.py
      - name: Apply R324 conditional cached USD balances persistence
        run: python3 pos7-release-audit/r320/optimize_balances.py
      - name: Apply R323 offline-only local backup approval for Tab2
        run: python3 pos7-release-audit/r323/apply_local_only.py
      - name: Add R324 same-device-only cloud reconciliation gated by R305
        run: python3 pos7-release-audit/r324/apply_same_device.py
      - name: Check R324 lazy stock summary and stable R312 foundation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('r305-android/tab2/POS7_Tablet/app/src/main/assets')
          h=(base/'index.html').read_text()
          g=Path('r305-android/tab2/POS7_Tablet/app/build.gradle').read_text()
          assert 'POS7_RESTORE_PENDING_R305' in h
          assert 'restore_transfer.js' in h
          assert (base/'restore_transfer.js').exists()
          assert 'window.pako.deflate(value,{level:1});' in h
          assert 'window.pos307HomeBatchInstalled=true' in h
          assert 'if(!window.pos307MarkHomeDirty || !window.pos307MarkHomeDirty())renderHome();' in h
          assert 'var pos185Serialized=JSON.stringify(state);' not in h
          assert "versionName '485.7.229-r324-tab2'" in g
          assert h.count('المتجر الثاني — قاعدة مستقلة • 485.7.229-r324-tab2')==1
          assert 'المتجر الثاني — قاعدة مستقلة • R215' not in h
          assert 'window.pos309HomeBatchActive=()=>depth>0;' in h
          assert "if(name==='renderHome' && window.pos309HomeBatchActive?.())" in h
          assert h.count('id="pos7-r310-purchase-single-commit"')==1
          assert 'window.pos310PurchaseActive?.()?pos7R102SaveStateDirect()' in h
          assert 'if(window.pos310DeferSave?.())return;' in h
          assert 'id="pos7-r311-sale-single-commit"' not in h
          assert 'window.pos311SaleActive' not in h
          assert 'id="pos7-r310-purchase-single-commit"' in h
          assert h.count('id="pos7-r314-boot-profiler"')==1
          assert 'window.pos314HookStorage();' in h
          assert 'window.pos314HookFunctions();' in h
          assert 'window.POS7_BOOT_DIAG_R314.mark(\'splashHidden\')' in h
          assert 'window.pos311SaleActive' not in h
          assert 'instrumentDOMContentLoaded' in h
          assert 'D.domListeners' in h
          assert h.count('function buildSaleIndex()')==1
          assert "document.addEventListener('DOMContentLoaded',summary);" not in h
          print('R324 lazy inventory summary preserves R315 diagnostics, R312 sales and R310 purchase')
          PY
      - name: Test invoice home batching and durable writes
        run: |
          node pos7-release-audit/r307/coalesce.test.mjs
          node pos7-release-audit/r309/render-home.test.mjs
          node pos7-release-audit/r310/single-commit.test.mjs
          node pos7-release-audit/r314/boot_diag.test.mjs
          node pos7-release-audit/r315/dom_ready.test.mjs
          node pos7-release-audit/r316/stock_summary.test.mjs
          node pos7-release-audit/r317/lazy_startup.test.mjs
          node pos7-release-audit/r318/home_boot.test.mjs
          node pos7-release-audit/r319/accounting_boot.test.mjs
          node pos7-release-audit/r320/balances.test.mjs
          node pos7-release-audit/r323/local_restore.test.mjs
          node pos7-release-audit/r324/same_device_cloud.test.mjs
      - name: Check HTML JavaScript syntax
        run: |
          python3 - <<'PY2'
          from html.parser import HTMLParser
          import subprocess,pathlib
          class P(HTMLParser):
              def __init__(self): super().__init__();self.active=False;self.s=[]
              def handle_starttag(self,t,a):
                  if t=='script': self.active=True;self.s.append('')
              def handle_endtag(self,t):
                  if t=='script':self.active=False
              def handle_data(self,d):
                  if self.active:self.s[-1]+=d
          p=P();p.feed(pathlib.Path('r305-android/${{ matrix.branch }}/POS7_Tablet/app/src/main/assets/index.html').read_text())
          for i,s in enumerate(p.s):
              if s.strip():
                  r=subprocess.run(['node','--check'],input=s,text=True,capture_output=True)
                  if r.returncode:raise SystemExit(f'Script {i}: {r.stderr}')
          PY2
      - name: Apply tested Tab2 storage patch and Android bridge
        run: |
          app=r305-android/tab2/POS7_Tablet/app
          python3 pos7-release-audit/r345/apply_storage_html.py "$app/src/main/assets/index.html"
          python3 pos7-release-audit/r345/apply_native.py
          node pos7-release-audit/r345/storage_tests.cjs "$app/src/main/assets/index.html"
          node --check "$app/src/main/assets/r331_storage_settings.js"
          node --check "$app/src/main/assets/r333_storage_dashboard.js"
      - name: Verify candidate scripts and store separation
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess,hashlib
          class P(HTMLParser):
              def __init__(self): super().__init__();self.active=False;self.s=[]
              def handle_starttag(self,t,a):
                  if t=='script': self.active=True;self.s.append('')
              def handle_endtag(self,t):
                  if t=='script': self.active=False
              def handle_data(self,d):
                  if self.active:self.s[-1]+=d
          h=Path('r305-android/tab2/POS7_Tablet/app/src/main/assets/index.html')
          assert hashlib.sha256(h.read_bytes()).hexdigest()=='0e626ad4a5fc6bc9499276521714237fbcd11cf134d3c7fa7ca1b35cc799b007'
          s=h.read_text(encoding='utf8')
          assert 'jdcolkgzwqpwbfvcrdje' not in s
          assert 'https://rmskuolsiqbzxuakofpb.supabase.co' in s
          assert 'المتجر الثاني — قاعدة مستقلة • 485.7.229-r345-tab2' in s
          assert "if(localStorage.getItem('POS7_RESTORE_PENDING_R305'))return false;" in s
          p=P();p.feed(s)
          for i,s in enumerate(p.s):
              if s.strip():
                  r=subprocess.run(['node','--check'],input=s,text=True,capture_output=True)
                  if r.returncode:raise SystemExit(f'Script {i}: {r.stderr}')
          print('Candidate JS and identity verified')
          PY
      - name: Compile Java integration only (no signed or installable APK)
        working-directory: r305-android/tab2/POS7_Tablet
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
