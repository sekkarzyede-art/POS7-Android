name: POS7 R297 Android Native Identity Fail-Closed Compile
on:
  push:
    branches: [pos7-r285-audit-only]
    paths:
      - 'pos7-release-audit/r297/**'
      - '.github/workflows/pos7-r297-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-android-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check JVM native branch guard
        run: |
          mkdir -p /tmp/r297
          javac -d /tmp/r297 pos7-release-audit/r297/NativeBranchPolicy.java pos7-release-audit/r297/NativeBranchPolicyTest.java
          java -cp /tmp/r297 com.sokkarzeyedeh.pos7.NativeBranchPolicyTest
      - name: Restore original Android sources and apply fail-closed native guard
        run: |
          python3 pos7-release-audit/r296/make_unified_compile_candidate.py
          cp pos7-release-audit/r297/NativeBranchPolicy.java r296-android/tab1/POS7_Tablet/app/src/main/java/com/sokkarzeyedeh/pos7/
          cp pos7-release-audit/r297/NativeBranchBridge.java r296-android/tab1/POS7_Tablet/app/src/main/java/com/sokkarzeyedeh/pos7/
          grep -F 'server_verified_identity' r296-android/tab1/POS7_Tablet/app/src/main/java/com/sokkarzeyedeh/pos7/NativeBranchBridge.java
      - name: Compile real Android project; NO APK
        working-directory: r296-android/tab1/POS7_Tablet
        run: gradle --no-daemon :app:compileDebugJavaWithJavac
      - name: Export source (NOT INSTALLABLE)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          p=Path('r296-android/tab1/POS7_Tablet')
          with ZipFile('POS7_R297_NATIVE_GUARD_SOURCE_ONLY.zip','w',ZIP_DEFLATED) as z:
              for f in p.rglob('*'):
                  if f.is_file() and not set(f.relative_to(p).parts).intersection({'build','.gradle'}):
                      z.write(f,arcname='POS7_Tablet/'+str(f.relative_to(p)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: POS7-R297-NATIVE-GUARD-SOURCE-NO-APK
          path: POS7_R297_NATIVE_GUARD_SOURCE_ONLY.zip
          if-no-files-found: error
