
name: POS7 R254 Safe Logout After Inventory Batch Phone APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r254-phone-safe-logout.yml'
      - 'POS7_R254_PHONE_LOGOUT_BATCH_GUARD_SOURCE.zip'
  workflow_dispatch:
    inputs:
      installed_phone_code:
        description: 'Optional currently installed phone versionCode'
        required: false
        default: ''
        type: string
      installed_tablet_code:
        description: 'Unused for phone-only build'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Signed ${{ matrix.kind }} release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: Phone
            project: POS7_Owner_Phone
            package: com.sokkarzeyedeh.pos7owner
            version: 485.7.143-r254-logout-batch-guard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK 35
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract and validate source
        env:
          PROJECT: ${{ matrix.project }}
          EXPECTED_PACKAGE: ${{ matrix.package }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile, os
          from pathlib import Path

          src = Path('POS7_R254_PHONE_LOGOUT_BATCH_GUARD_SOURCE.zip')
          if not src.is_file():
              raise SystemExit('Missing source ZIP at repository root')

          dest = Path('android-project').resolve()
          with zipfile.ZipFile(src) as z:
              for item in z.infolist():
                  if not (dest / item.filename).resolve().is_relative_to(dest):
                      raise SystemExit('Unsafe ZIP entry')
              z.extractall(dest)

          app = dest / os.environ['PROJECT']
          gradle = (app / 'app/build.gradle').read_text('utf-8')
          html = (app / 'app/src/main/assets/index.html').read_text('utf-8')

          assert (
              "applicationId '" + os.environ['EXPECTED_PACKAGE'] + "'"
          ) in gradle

          assert (
              "versionName '" + os.environ['EXPECTED_VERSION'] + "'"
          ) in gradle

          assert 'pos7_owner_snapshot' in html
          assert 'samePhotoContext' in html
          assert 'photoCheck' in html
          assert (app / 'app/src/main/java').exists()

          print('R254 source verified')
          PY

      - name: Check JavaScript
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, os

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.active = True
                      self.parts.append('')

              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.active = False

              def handle_data(self, data):
                  if self.active:
                      self.parts[-1] += data

          path = Path(
              'android-project',
              os.environ['PROJECT'],
              'app/src/main/assets/index.html'
          )

          parser = Parser()
          parser.feed(path.read_text('utf-8'))

          for js in parser.parts:
              if js.strip():
                  Path('/tmp/pos7-check.js').write_text(js)
                  subprocess.run(
                      ['node', '--check', '/tmp/pos7-check.js'],
                      check=True
                  )

          print('JavaScript syntax verified')
          PY

      - name: Determine upgrade-safe versionCode
        env:
          INSTALLED_PHONE: ${{ inputs.installed_phone_code }}
        run: |
          python3 - <<'PY'
          import os

          raw = os.getenv('INSTALLED_PHONE', '').strip()

          if raw and not (raw.isascii() and raw.isdecimal()):
              raise SystemExit('Invalid installed versionCode')

          code = max(
              2000009000 + int(os.environ['GITHUB_RUN_NUMBER']),
              int(raw) + 1 if raw else 0
          )

          if code > 2100000000:
              raise SystemExit('VersionCode too high')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'POS7_VERSION_CODE={code}\n')

          print('VersionCode:', code)
          PY

      - name: Restore original Firebase
        env:
          POS7_FIREBASE_JSON_BASE64: ${{ secrets.POS7_FIREBASE_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${POS7_FIREBASE_JSON_BASE64:-}"

          umask 077
          printf '%s' "$POS7_FIREBASE_JSON_BASE64" |
            base64 --decode > android-project/POS7_Owner_Phone/app/google-services.json

          python3 - <<'PY'
          import json

          path = 'android-project/POS7_Owner_Phone/app/google-services.json'
          data = json.load(open(path))

          assert data['project_info']['project_id'] == 'pos7-owner-notifications'

          packages = [
              x['client_info']['android_client_info']['package_name']
              for x in data['client']
          ]

          assert 'com.sokkarzeyedeh.pos7owner' in packages
          PY

      - name: Restore original signing certificate
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for v in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            test -n "${!v:-}" || {
              echo "Missing signing secret: $v"
              exit 1
            }
          done

          umask 077
          keyfile="$RUNNER_TEMP/pos7-release.jks"

          printf '%s' "$POS7_KEYSTORE_BASE64" |
            base64 --decode > "$keyfile"

          actual=$(keytool -exportcert \
            -keystore "$keyfile" \
            -storepass:env POS7_KEYSTORE_PASSWORD \
            -alias "$POS7_KEY_ALIAS" |
            sha256sum | awk '{print $1}')

          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'

          test "$actual" = "$expected" || {
            echo 'Original signing certificate mismatch'
            exit 1
          }

          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android-project/${{ matrix.project }}
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify signed APK
        env:
          PROJECT: ${{ matrix.project }}
          PACKAGE: ${{ matrix.package }}
          VERSION: ${{ matrix.version }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail

          apk="android-project/$PROJECT/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"

          tool="$ANDROID_HOME/build-tools/35.0.0"

          "$tool/apksigner" verify --verbose "$apk"
          "$tool/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"

          grep -F "package: name='$PACKAGE' versionCode='$POS7_VERSION_CODE' versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"

          actual=$("$tool/apksigner" verify --print-certs "$apk" |
            awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' |
            tr -d ':[:space:]' |
            tr '[:upper:]' '[:lower:]')

          test "$actual" = "$POS7_SIGNING_CERT_SHA256" || {
            echo 'APK signing certificate mismatch'
            exit 1
          }

          mkdir -p output
          cp "$apk" "output/POS7_${KIND}_R254.apk"

          sha256sum output/*.apk > output/SHA256SUMS.txt

          printf 'Package=%s\nVersionName=%s\nVersionCode=%s\nCertificate=%s\n' \
            "$PACKAGE" "$VERSION" "$POS7_VERSION_CODE" "$actual" \
            > output/build-info.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: POS7-Phone-R254-Safe-Logout-${{ env.POS7_VERSION_CODE }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Clean temporary secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/pos7-release.jks"
          rm -f android-project/POS7_Owner_Phone/app/google-services.json
