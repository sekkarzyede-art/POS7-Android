name: POS7 Tablet 485.7.225 Signed Release
on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: "Actual installed tablet versionCode (Android), optional"
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify sources and compute upgrade versionCode
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path('POS7_Tablet/app/src/main/assets/index.html')
          s=p.read_text()
          assert "window.POS7_APP_VERSION='485.7.225'" in s
          assert 'pos7-photo-sync-r34' in s
          assert 'pos7PhotoRun' in s
          assert "versionName '485.7.225'" in Path('POS7_Tablet/app/build.gradle').read_text()
          raw=(os.environ.get('INSTALLED_CODE') or '').strip()
          if raw and (not raw.isascii() or not raw.isdecimal()):raise SystemExit('Invalid installed versionCode')
          code=max(48508242, int(raw)+1 if raw else 0, 48508242+int(os.environ['GITHUB_RUN_NUMBER']))
          if code>2100000000:raise SystemExit('versionCode overflow')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('POS7_VERSION_CODE=%s\n'%code)
          print('Upgrade versionCode:',code)
          PY
      - name: Validate JS
        run: python3 POS7_Tablet/ci/validate.py
      - name: Verify original signing secrets and certificate
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for x in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do test -n "${!x:-}" || { echo "Missing $x"; exit 1; }; done
          umask 077
          printf %s "$POS7_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/original.jks"
          cert=$(keytool -exportcert -keystore "$RUNNER_TEMP/original.jks" -storepass:env POS7_KEYSTORE_PASSWORD -alias "$POS7_KEY_ALIAS" | sha256sum | awk '{print $1}')
          test "$cert" = "843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495" || { echo 'WRONG SIGNER'; exit 1; }
          echo "POS7_KEYSTORE_PATH=$RUNNER_TEMP/original.jks" >> "$GITHUB_ENV"
          echo "EXPECTED_CERT=$cert" >> "$GITHUB_ENV"
      - name: Build signed tablet
        working-directory: POS7_Tablet
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease
      - name: Validate APK package version and signature
        run: |
          set -euo pipefail
          apk=POS7_Tablet/app/build/outputs/apk/release/app-release.apk
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk/apksigner" verify --verbose "$apk"
          "$sdk/aapt" dump badging "$apk" | grep -F "package: name='com.sokkarzeyedeh.pos7' versionCode='$POS7_VERSION_CODE' versionName='485.7.225'"
          cert=$("$sdk/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$cert" = "$EXPECTED_CERT"
          mkdir -p output
          cp "$apk" output/POS7_Tablet_v485.7.225_Manual_Photos.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: POS7-Tablet-485.7.225
          path: output/
          if-no-files-found: error
