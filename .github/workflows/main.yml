name: Build POS7 Owner Phone APK v485.7.115

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'POS7_Owner_Phone_v485.7.115_APK_Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build-owner-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          yes | sdkmanager --licenses >/dev/null || true

      - name: Extract owner phone project
        run: |
          set -euo pipefail
          unzip -q POS7_Owner_Phone_v485.7.115_APK_Project.zip -d android-project
          test -f android-project/POS7_Owner_Phone_v485.7.115_APK_Project/Android/POS7_Owner_Phone/settings.gradle

      - name: Configure and verify POS7 signing key
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/pos7-release.jks"
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          keytool -list -keystore "$keyfile" -storepass "$POS7_KEYSTORE_PASSWORD" -alias "$POS7_KEY_ALIAS" >/dev/null
          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'
          actual=$(keytool -exportcert -keystore "$keyfile" -storepass "$POS7_KEYSTORE_PASSWORD" -alias "$POS7_KEY_ALIAS" | sha256sum | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            echo 'Signing key certificate does not match the verified POS7 certificate.' >&2
            exit 1
          fi
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Build signed owner phone APK
        working-directory: android-project/POS7_Owner_Phone_v485.7.115_APK_Project/Android/POS7_Owner_Phone
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK package, version, and signing certificate
        run: |
          set -euo pipefail
          apk=android-project/POS7_Owner_Phone_v485.7.115_APK_Project/Android/POS7_Owner_Phone/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -Fq "package: name='com.sokkarzeyedeh.pos7owner' versionCode='48507115' versionName='485.7.115'"
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ "$actual" != "$POS7_SIGNING_CERT_SHA256" ]]; then
            echo 'APK signer differs from the configured POS7 signing key.' >&2
            exit 1
          fi

      - name: Upload signed owner phone APK
        uses: actions/upload-artifact@v4
        with:
          name: POS7-Owner-Phone-v485.7.115-apk
          path: android-project/POS7_Owner_Phone_v485.7.115_APK_Project/Android/POS7_Owner_Phone/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
