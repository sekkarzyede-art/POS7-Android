name: Build POS7 Owner Phone v485.7.143 R191

on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: 'Optional installed APK versionCode; leave blank for high-range automatic code'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platforms
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract and verify phone source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          src=Path('POS7_Phone_v485.7.143_R191_Project.zip')
          dest=Path('android-project').resolve()
          if not src.is_file(): raise SystemExit('Missing POS7_Phone_v485.7.143_R191_Project.zip')
          with zipfile.ZipFile(src) as z:
              for info in z.infolist():
                  target=(dest/info.filename).resolve()
                  if not target.is_relative_to(dest):
                      raise SystemExit('Unsafe ZIP entry: '+info.filename)
              z.extractall(dest)
          app=dest/'POS7_Owner_Phone'
          gradle=(app/'app/build.gradle').read_text('utf-8')
          html=(app/'app/src/main/assets/index.html').read_text('utf-8')
          manifest=(app/'app/src/main/AndroidManifest.xml').read_text('utf-8')
          main_java=app/'app/src/main/java/com/sokkarzeyedeh/pos7owner/MainActivity.java'
          fcm_java=app/'app/src/main/java/com/sokkarzeyedeh/pos7owner/Pos7MessagingService.java'
          checks=[
            ("applicationId 'com.sokkarzeyedeh.pos7owner'" in gradle,'package ID'),
            ("versionName '485.7.143-r191'" in gradle,'versionName'),
            ('r105-inventory-send' in html,'phone inventory sender'),
            ('r115-inventory-ack-monitor' in html,'inventory acknowledgement monitor'),
            ('pos7_owner_commands' in html,'inventory cloud commands'),
            ('default_notification_channel_id' in manifest,'FCM channel'),
            (main_java.is_file() and fcm_java.is_file(),'native phone/FCM source'),
          ]
          for ok,what in checks:
              if not ok: raise SystemExit('Source validation failed: '+what)
          print('v485.7.143-R191 phone source validated')
          PY

      - name: Validate embedded JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          class JSParser(HTMLParser):
              def __init__(self): super().__init__(); self.active=False; self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='script': self.active=True; self.scripts.append('')
              def handle_endtag(self,tag):
                  if tag=='script': self.active=False
              def handle_data(self,data):
                  if self.active: self.scripts[-1]+=data
          parser=JSParser()
          parser.feed(Path('android-project/POS7_Owner_Phone/app/src/main/assets/index.html').read_text('utf-8'))
          for i,script in enumerate(parser.scripts):
              if not script.strip(): continue
              result=subprocess.run(['node','--check'],input=script,text=True,capture_output=True)
              if result.returncode:
                  raise SystemExit(f'Inline script {i} failed: {result.stderr}')
          print('HTML JavaScript syntax OK:',len(parser.scripts),'script tags')
          PY

      - name: Assign upgrade-safe versionCode
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          python3 - <<'PY'
          import os
          raw=os.environ.get('INSTALLED_CODE','').strip()
          if raw and (not raw.isascii() or not raw.isdecimal()):
              raise SystemExit('installed_version_code must contain digits 0-9')
          code=max(2000000000 + int(os.environ['GITHUB_RUN_NUMBER']), (int(raw)+1 if raw else 0))
          if code>2100000000: raise SystemExit('versionCode too high')
          if raw and code<=int(raw): raise SystemExit('Version must exceed installed APK')
          with open(os.environ['GITHUB_ENV'],'a') as fp:
              fp.write(f'POS7_VERSION_CODE={code}\n')
          print('APK versionCode:',code)
          if not raw: print('WARNING: No installed APK code supplied; high-range code is not proof of upgrade compatibility')
          PY

      - name: Install the original Firebase configuration
        env:
          POS7_FIREBASE_JSON_BASE64: ${{ secrets.POS7_FIREBASE_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${POS7_FIREBASE_JSON_BASE64:-}" || { echo 'Missing secret: POS7_FIREBASE_JSON_BASE64'; exit 1; }
          umask 077
          printf '%s' "$POS7_FIREBASE_JSON_BASE64" | base64 --decode > android-project/POS7_Owner_Phone/app/google-services.json
          python3 - <<'PY'
          import json
          path='android-project/POS7_Owner_Phone/app/google-services.json'
          with open(path,'r') as f: obj=json.load(f)
          project=obj.get('project_info',{}).get('project_id')
          packages=[c.get('client_info',{}).get('android_client_info',{}).get('package_name') for c in obj.get('client',[])]
          if project!='pos7-owner-notifications':
              raise SystemExit('Unexpected Firebase project; do not link phone to a different backend')
          if 'com.sokkarzeyedeh.pos7owner' not in packages:
              raise SystemExit('Unexpected Firebase Android package')
          print('Firebase project/package IDs OK')
          PY

      - name: Verify original release signature
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then echo "Missing signing secret: $key"; exit 1; fi
          done
          keyfile="$RUNNER_TEMP/pos7-release.jks"
          umask 077
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'
          actual=$(keytool -exportcert -keystore "$keyfile" -storepass:env POS7_KEYSTORE_PASSWORD -alias "$POS7_KEY_ALIAS" | sha256sum | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            echo 'Signing certificate mismatch. Refusing incompatible app update.'
            exit 1
          fi
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"
          echo 'Original release certificate OK'

      - name: Build signed phone release
        working-directory: android-project/POS7_Owner_Phone
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK before upload
        run: |
          set -euo pipefail
          apk='android-project/POS7_Owner_Phone/app/build/outputs/apk/release/app-release.apk'
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/pos7-badging.txt"
          grep -F "package: name='com.sokkarzeyedeh.pos7owner' versionCode='$POS7_VERSION_CODE' versionName='485.7.143-r191'" "$RUNNER_TEMP/pos7-badging.txt"
          actual=$("$tools/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$POS7_SIGNING_CERT_SHA256" || { echo 'Final APK signature mismatch'; exit 1; }
          mkdir -p output
          cp "$apk" output/POS7_Owner_Phone_v485.7.143-R191_Blue.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
          printf 'versionName=485.7.143-r191\nversionCode=%s\ncertificateSHA256=%s\n' "$POS7_VERSION_CODE" "$actual" > output/build-info.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: POS7-Phone-v485.7.143-R191-${{ env.POS7_VERSION_CODE }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/pos7-release.jks"
          rm -f android-project/POS7_Owner_Phone/app/google-services.json
