name: Build POS7 v465 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل ملفات المستودع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: تحديد مجلد مشروع Android
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$GITHUB_WORKSPACE"
          if [[ ! -f "$project_dir/settings.gradle" && ! -f "$project_dir/settings.gradle.kts" ]]; then
            settings_file="$(find "$GITHUB_WORKSPACE" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.git/*' -print -quit)"
            if [[ -n "$settings_file" ]]; then
              project_dir="$(dirname "$settings_file")"
            else
              zip_file="$(find "$GITHUB_WORKSPACE" -type f -iname 'POS7_v465_APK_Project.zip' -not -path '*/.git/*' -print -quit)"
              if [[ -z "$zip_file" ]]; then
                zip_file="$(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print -quit)"
              fi
              if [[ -z "$zip_file" ]]; then
                echo 'لم أجد ملفات Gradle في المستودع أو ZIP للمشروع.' >&2
                exit 1
              fi
              unpack_dir="$RUNNER_TEMP/pos7-project"
              mkdir -p "$unpack_dir"
              unzip -q "$zip_file" -d "$unpack_dir"
              settings_file="$(find "$unpack_dir" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
              if [[ -z "$settings_file" ]]; then
                echo 'تم فك ZIP لكن لم أعثر على settings.gradle داخله.' >&2
                exit 1
              fi
              project_dir="$(dirname "$settings_file")"
            fi
          fi
          if [[ ! -f "$project_dir/app/build.gradle" && ! -f "$project_dir/app/build.gradle.kts" ]]; then
            echo "مجلد المشروع لا يحتوي app/build.gradle: $project_dir" >&2
            exit 1
          fi
          echo "مجلد البناء: $project_dir"
          printf 'dir=%s\n' "$project_dir" >> "$GITHUB_OUTPUT"

      - name: بناء APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: حفظ APK للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: POS7-v465-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
