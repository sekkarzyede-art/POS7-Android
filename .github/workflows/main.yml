name: Build Sokkar Zeyedeh POS7 v485 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.zip'
      - '*.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android project
        id: project
        run: |
          set -euo pipefail
          mkdir -p android-project
          if [[ -f POS7_v485_APK_Project/settings.gradle ]]; then
            project_dir=POS7_v485_APK_Project
          else
            archive="$(find . -maxdepth 5 -type f -iname 'POS7_v485_APK_Project*.zip' -print -quit)"
            if [[ -z "$archive" ]]; then
              archive="$(find . -maxdepth 5 -type f -iname '*v485*APK*Project*.zip' -print -quit)"
            fi
            if [[ -z "$archive" ]]; then
              echo 'Project ZIP not found. Upload POS7_v485_APK_Project.zip (or a renamed copy) to the repository, or upload the extracted POS7_v485_APK_Project folder.' >&2
              find . -maxdepth 4 -type f -iname '*.zip' -print >&2 || true
              exit 1
            fi
            echo "Using project archive: $archive"
            unzip -q "$archive" -d android-project
            project_dir="$(find android-project -maxdepth 6 -type f -name settings.gradle -print -quit | xargs -r dirname)"
          fi
          if [[ -z "${project_dir:-}" || ! -f "$project_dir/app/build.gradle" ]]; then
            echo 'The uploaded archive does not contain a Gradle Android project with app/build.gradle.' >&2
            exit 1
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Configure signing key
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/pos7-release.jks"
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        run: |
          apk='${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: Sokkar-Zeyedeh-POS7-v485-release-update-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
