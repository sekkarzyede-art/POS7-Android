name: Build POS7 v456 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract POS7 v456 project
        run: unzip -oq POS7_v456_APK_Print_Fixed_Project.zip -d pos7_v456

      - name: Build debug APK
        run: gradle --no-daemon -p pos7_v456 assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS7-v456-print-fix-debug-apk
          path: pos7_v456/app/build/outputs/apk/debug/app-debug.apk
