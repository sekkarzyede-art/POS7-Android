
name: Build POS7 Tablet Script Fixed

on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: 'Installed APK versionCode'
        required: false
        default: '48507259'
        type: string
  push:
    branches: [main]
    paths:
      - 'POS7_Tablet_v485.7.130_Script_Fixed_BuildReady.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Extract fixed project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          name = 'POS7_Tablet_v485.7.130_Script_Fixed_BuildReady.zip'
          target = Path('android-project').resolve()

          with zipfile.ZipFile(name) as z:
              for item in z.infolist():
                  dest = (target / item.filename).resolve()
                  if not dest.is_relative_to(target):
                      raise SystemExit('Unsafe ZIP path')
              z.extractall(target)

          root = target / 'POS7_Tablet'
          assert (root / 'settings.gradle').is_file()
          assert (root / 'app/build.gradle').is_file()

          html = (root / 'app/src/main/assets/index.html').read_text()
          assert '485.7.130' in html
          assert 'pos130Drive' in html
          assert 'shareBackupJson' in html

          print('Fixed POS7 project extracted')
          PY

      - name: Set upgrade version
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          python3 - <<'PY'
          import os

          raw = os.environ.get('INSTALLED_CODE', '').strip()
          raw = raw or '48507259'

          if not raw.isascii() or not raw.isdecimal():
              raise SystemExit('Invalid versionCode')

          code = max(
              48507130 + int(os.environ['GITHUB_RUN_NUMBER']),
              int(raw) + 1
          )

          if code > 2100000000:
              raise SystemExit('versionCode too large')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'POS7_VERSION_CODE={code}\n')

          print('Building versionCode:', code)
          PY

      - name: Verify original signing certificate
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for key in \
            POS7_KEYSTORE_BASE64 \
            POS7_KEYSTORE_PASSWORD \
            POS7_KEY_ALIAS \
            POS7_KEY_PASSWORD
          do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing signing secret: $key"
              exit 1
            fi
          done

          keyfile="$RUNNER_TEMP/pos7-release.jks"
          umask 077

          printf '%s' "$POS7_KEYSTORE_BASE64" \
            | base64 --decode > "$keyfile"

          expected="843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495"

          actual=$(keytool -exportcert \
            -keystore "$keyfile" \
            -storepass:env POS7_KEYSTORE_PASSWORD \
            -alias "$POS7_KEY_ALIAS" \
            | sha256sum | awk '{print $1}')

          if [[ "$actual" != "$expected" ]]; then
            echo "Wrong POS7 signing certificate"
            exit 1
          fi

          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: android-project/POS7_Tablet
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Verify and package APK
        run: |
          set -euo pipefail

          apk="android-project/POS7_Tablet/app/build/outputs/apk/release/app-release.apk"
          sdk="$ANDROID_HOME/build-tools/35.0.0"

          "$sdk/apksigner" verify --verbose "$apk"

          "$sdk/aapt" dump badging "$apk" \
            > "$RUNNER_TEMP/pos7-badging.txt"

          grep -F \
            "package: name='com.sokkarzeyedeh.pos7' versionCode='$POS7_VERSION_CODE' versionName='485.7.130'" \
            "$RUNNER_TEMP/pos7-badging.txt"

          actual=$("$sdk/apksigner" verify \
            --print-certs "$apk" \
            | awk -F': ' \
              '/Signer #1 certificate SHA-256 digest:/ {print $2}' \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')

          test "$actual" = "$POS7_SIGNING_CERT_SHA256"

          mkdir -p output

          cp "$apk" \
            output/POS7_Tablet_v485.7.130_Script_Fixed.apk

          sha256sum output/*.apk > output/SHA256SUMS.txt

          printf \
            'versionName=485.7.130\nversionCode=%s\ncertificateSHA256=%s\n' \
            "$POS7_VERSION_CODE" "$actual" \
            > output/build-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS7-Tablet-Script-Fixed-${{ env.POS7_VERSION_CODE }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/pos7-release.jks"
