name: Package POS7 v485.7.57 HTML test versions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'POS7_v485.7.57_Tablet_Test.html'
      - 'POS7_v485.7.57_Owner_Phone_Test.html'
      - 'POS7_v485.7.57_Owner_Cloud.sql'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  package-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check files and package the HTML tests
        shell: bash
        run: |
          set -euo pipefail
          test -s POS7_v485.7.57_Tablet_Test.html
          test -s POS7_v485.7.57_Owner_Phone_Test.html
          test -s POS7_v485.7.57_Owner_Cloud.sql
          mkdir -p dist
          zip -j dist/POS7_v485.7.57_HTML_Test_Versions.zip \
            POS7_v485.7.57_Tablet_Test.html \
            POS7_v485.7.57_Owner_Phone_Test.html \
            POS7_v485.7.57_Owner_Cloud.sql

      - name: Upload HTML test versions
        uses: actions/upload-artifact@v4
        with:
          name: POS7-v485.7.57-HTML-test-versions
          path: dist/POS7_v485.7.57_HTML_Test_Versions.zip
          if-no-files-found: error
          retention-days: 14
