name: Build POS7 Tablet 485.7.130 Startup Fixed

on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: "Installed APK versionCode"
        required: false
        default: "48507259"
        type: string

  push:
    branches: [main]
    paths:
      - 'POS7_Tablet_v485.7.130_Startup_Fixed_Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Extract POS7 project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          archive = Path(
              'POS7_Tablet_v485.7.130_Startup_Fixed_Project.zip'
          )
          if not archive.is_file():
              raise SystemExit('Project ZIP missing')

          target = Path('android-project').resolve()

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  dest = (target / item.filename).resolve()
                  if not dest.is_relative_to(target):
                      raise SystemExit('Unsafe ZIP path')
              z.extractall(target)

          root = target / 'POS7_Tablet'
          assert (root / 'settings.gradle').is_file()
          assert (root / 'app/build.gradle').is_file()

          html = root / 'app/src/main/assets/index.html'
          assert html.is_file()
          assert '485.7.130' in html.read_text()

          print('Project extracted successfully')
          PY

      - name: Validate JavaScript before building
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.external = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.inside = True
                      self.external = 'src' in dict(attrs)
                      self.parts = []

              def handle_data(self, data):
                  if self.inside:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.inside:
                      if not self.external:
                          self.scripts.append(''.join(self.parts))
                      self.inside = False

          path = Path(
              'android-project/POS7_Tablet/'
              'app/src/main/assets/index.html'
          )

          parser = Scripts()
          parser.feed(path.read_text())

          checked = 0

          for script in parser.scripts:
              if not script.strip():
                  continue

              with tempfile.NamedTemporaryFile(
                  mode='w',
                  suffix='.js'
              ) as f:
                  f.write(script)
                  f.flush()

                  result = subprocess.run(
                      ['node', '--check', f.name],
                      capture_output=True,
                      text=True
                  )

                  if result.returncode:
                      raise SystemExit(
                          'JavaScript syntax error:\n'
                          + result.stderr
                      )

              checked += 1

          print(f'Validated {checked} JavaScript blocks')
          PY

      - name: Fix Kotlin dependency conflicts
        working-directory: android-project/POS7_Tablet
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/build.gradle')
          s = p.read_text()

          marker = 'POS7_KOTLIN_FIX_FINAL'

          if marker not in s:
              fix = [
                  '',
                  '// POS7_KOTLIN_FIX_FINAL',
                  'configurations.configureEach {',
                  '    resolutionStrategy.eachDependency { details ->',
                  "        if (details.requested.group == 'org.jetbrains.kotlin' &&",
                  "            details.requested.name.startsWith('kotlin-stdlib')) {",
                  "            details.useVersion '1.8.22'",
                  '        }',
                  '    }',
                  '}',
                  ''
              ]
              s += '\n'.join(fix)
              p.write_text(s)

          print('Kotlin versions aligned')
          PY

      - name: Set upgrade versionCode
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          raw = (
              os.environ.get('INSTALLED_CODE', '').strip()
              or '48507259'
          )

          if not raw.isascii() or not raw.isdecimal():
              raise SystemExit('Invalid versionCode')

          code = max(
              48507260,
              int(raw) + 1,
              48507259 + int(os.environ['GITHUB_RUN_NUMBER'])
          )

          if code > 2100000000:
              raise SystemExit('versionCode too large')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'POS7_VERSION_CODE={code}\n')

          print('New versionCode:', code)
          PY

      - name: Verify original POS7 signing certificate
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for key in \
            POS7_KEYSTORE_BASE64 \
            POS7_KEYSTORE_PASSWORD \
            POS7_KEY_ALIAS \
            POS7_KEY_PASSWORD
          do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing signing secret: $key"
              exit 1
            fi
          done

          keyfile="$RUNNER_TEMP/pos7-release.jks"
          umask 077

          printf '%s' "$POS7_KEYSTORE_BASE64" \
            | base64 --decode > "$keyfile"

          expected="843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495"

          actual=$(keytool -exportcert \
            -keystore "$keyfile" \
            -storepass:env POS7_KEYSTORE_PASSWORD \
            -alias "$POS7_KEY_ALIAS" \
            | sha256sum | awk '{print $1}')

          if [[ "$actual" != "$expected" ]]; then
            echo "Wrong POS7 signing certificate"
            exit 1
          fi

          echo "POS7_KEYSTORE_PATH=$keyfile" \
            >> "$GITHUB_ENV"

          echo "POS7_SIGNING_CERT_SHA256=$actual" \
            >> "$GITHUB_ENV"

          echo "Original POS7 certificate verified"

      - name: Build signed APK
        working-directory: android-project/POS7_Tablet
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify and package APK
        run: |
          set -euo pipefail

          apk="android-project/POS7_Tablet/app/build/outputs/apk/release/app-release.apk"
          sdk="$ANDROID_HOME/build-tools/35.0.0"

          test -f "$apk"

          "$sdk/apksigner" verify --verbose "$apk"

          "$sdk/aapt" dump badging "$apk" \
            > "$RUNNER_TEMP/pos7-badging.txt"

          grep -F \
            "package: name='com.sokkarzeyedeh.pos7' versionCode='$POS7_VERSION_CODE' versionName='485.7.130'" \
            "$RUNNER_TEMP/pos7-badging.txt"

          actual=$("$sdk/apksigner" verify \
            --print-certs "$apk" \
            | awk -F': ' \
              '/Signer #1 certificate SHA-256 digest:/ {print $2}' \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')

          test "$actual" = "$POS7_SIGNING_CERT_SHA256"

          mkdir -p output

          cp "$apk" \
            output/POS7_Tablet_v485.7.130_Startup_Fixed.apk

          sha256sum output/*.apk \
            > output/SHA256SUMS.txt

          printf \
            'versionName=485.7.130\nversionCode=%s\ncertificateSHA256=%s\n' \
            "$POS7_VERSION_CODE" "$actual" \
            > output/build-info.txt

          echo "APK verified"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS7-Tablet-Startup-Fixed-${{ env.POS7_VERSION_CODE }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/pos7-release.jks"
