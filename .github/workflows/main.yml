name: Build POS7 Tablet and Phone APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.zip'
      - '*.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract both Android projects
        run: |
          set -euo pipefail
          mkdir -p android-project
          archive="$(find . -maxdepth 5 -type f -iname 'POS7_v485_Dual_APK_Project_Distinct_Names.zip' -print -quit)"
          if [[ -z "$archive" ]]; then
            archive="$(find . -maxdepth 5 -type f -iname '*Dual*APK*Project*.zip' -print -quit)"
          fi
          if [[ -z "$archive" ]]; then
            archive="$(find . -maxdepth 5 -type f -iname '*Tablet*Phone*APK*Project*.zip' -print -quit)"
          fi
          if [[ -z "$archive" ]]; then
            echo 'Dual tablet and phone APK project ZIP not found.' >&2
            find . -maxdepth 4 -type f -iname '*.zip' -print >&2 || true
            exit 1
          fi
          unzip -q "$archive" -d android-project
          test -f android-project/POS7_v485_Dual_APK_Project/Tablet/POS7_v485_APK_Project/settings.gradle
          test -f android-project/POS7_v485_Dual_APK_Project/Phone/POS7_v485_APK_Project/settings.gradle

      - name: Configure signing key
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/pos7-release.jks"
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"

      - name: Build tablet release APK
        working-directory: android-project/POS7_v485_Dual_APK_Project/Tablet/POS7_v485_APK_Project
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify tablet APK signature
        run: |
          apk='android-project/POS7_v485_Dual_APK_Project/Tablet/POS7_v485_APK_Project/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"

      - name: Give tablet APK a distinct filename
        run: |
          mkdir -p dist
          cp android-project/POS7_v485_Dual_APK_Project/Tablet/POS7_v485_APK_Project/app/build/outputs/apk/release/app-release.apk dist/POS7-Tablet-v485.7.65.apk

      - name: Upload tablet APK
        uses: actions/upload-artifact@v7
        with:
          name: POS7-Tablet-v485.7.65-update-apk
          path: dist/POS7-Tablet-v485.7.65.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build phone release APK
        working-directory: android-project/POS7_v485_Dual_APK_Project/Phone/POS7_v485_APK_Project
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify phone APK signature
        run: |
          apk='android-project/POS7_v485_Dual_APK_Project/Phone/POS7_v485_APK_Project/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"

      - name: Give phone APK a distinct filename
        run: |
          mkdir -p dist
          cp android-project/POS7_v485_Dual_APK_Project/Phone/POS7_v485_APK_Project/app/build/outputs/apk/release/app-release.apk dist/POS7-Phone-v485.7.66.apk

      - name: Upload phone APK
        uses: actions/upload-artifact@v7
        with:
          name: POS7-Phone-v485.7.66-update-apk
          path: dist/POS7-Phone-v485.7.66.apk
          if-no-files-found: error
          retention-days: 14
