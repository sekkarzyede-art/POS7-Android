name: Build POS7 Tablet 485.7.129 Backup

on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: 'Optional: installed APK versionCode (new build will be higher)'
        required: false
        default: '48507128'
        type: string
  push:
    branches: [main]
    paths:
      - 'POS7_Tablet_v485.7.129_APK_Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract tablet project
        run: |
          set -euo pipefail
          test -f POS7_Tablet_v485.7.129_APK_Project.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          target = Path('android-project').resolve()
          with zipfile.ZipFile('POS7_Tablet_v485.7.129_APK_Project.zip') as z:
              for item in z.infolist():
                  if not (target / item.filename).resolve().is_relative_to(target):
                      raise SystemExit('Unsafe archive path')
              z.extractall(target)
          root = target / 'POS7_Tablet'
          assert (root / 'settings.gradle').is_file()
          assert "versionName '485.7.129'" in (root / 'app/build.gradle').read_text()
          html = (root / 'app/src/main/assets/index.html').read_text()
          assert '485.7.129' in html
          assert 'pos129UploadBackup' in html and 'shareBackupJson' in html
          assert 'details.contains(b)' in html
          assert (root / 'app/src/main/res/xml/backup_paths.xml').is_file()
          PY

      - name: Set an upgrade-compatible versionCode
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          python3 - <<'PY'
          import os
          raw = os.environ.get('INSTALLED_CODE', '').strip() or '48507128'
          if not raw.isascii() or not raw.isdecimal():
              raise SystemExit('installed_version_code must contain English digits only')
          code = max(48507129 + int(os.environ['GITHUB_RUN_NUMBER']), int(raw) + 1)
          if code > 2100000000:
              raise SystemExit('versionCode exceeds the Android release limit')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'POS7_VERSION_CODE={code}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'POS7 485.7.129; versionCode: **{code}**; UI 485.7.129: cloud backups, WhatsApp file sharing, supplier date filter.\n')
          PY

      - name: Verify original POS7 release certificate
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then echo "Missing secret: $key"; exit 1; fi
          done
          keyfile="$RUNNER_TEMP/pos7-release.jks"
          umask 077
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'
          actual=$(keytool -exportcert -keystore "$keyfile" -storepass:env POS7_KEYSTORE_PASSWORD -alias "$POS7_KEY_ALIAS" | sha256sum | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            echo 'Wrong signing certificate: refusing a build that cannot update the original POS7 app.'
            exit 1
          fi
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Fix Gradle versionCode assignment
        run: |
          python3 - <<'PYFIX'
          from pathlib import Path
          import os
          p = Path('android-project/POS7_Tablet/app/build.gradle')
          source = p.read_text()
          old = "versionCode (System.getenv('POS7_VERSION_CODE') ?: '48507129').toInteger()"
          code = int(os.environ['POS7_VERSION_CODE'])
          if not 48507129 <= code <= 2100000000:
              raise SystemExit('Invalid versionCode')
          if source.count(old) != 1:
              raise SystemExit('Unexpected project versionCode line')
          p.write_text(source.replace(old, f'versionCode = {code}', 1))
          PYFIX

      - name: Build signed release
        working-directory: android-project/POS7_Tablet
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK identity, version and signer
        run: |
          set -euo pipefail
          apk='android-project/POS7_Tablet/app/build/outputs/apk/release/app-release.apk'
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk_tools/apksigner" verify --verbose "$apk"
          "$sdk_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/pos7-badging.txt"
          grep -F "package: name='com.sokkarzeyedeh.pos7' versionCode='$POS7_VERSION_CODE' versionName='485.7.129'" "$RUNNER_TEMP/pos7-badging.txt"
          actual=$("$sdk_tools/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$POS7_SIGNING_CERT_SHA256"
          mkdir -p output
          cp "$apk" output/POS7_Tablet_v485.7.129.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
          printf 'versionName=485.7.129\nversionCode=%s\ncertificateSHA256=%s\n' "$POS7_VERSION_CODE" "$actual" > output/build-info.txt

      - name: Downloadable signed APK
        uses: actions/upload-artifact@v4
        with:
          name: POS7-Tablet-485.7.129-${{ env.POS7_VERSION_CODE }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/pos7-release.jks"
