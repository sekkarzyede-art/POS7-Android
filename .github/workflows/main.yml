name: Package POS7 v485.7.57 HTML test versions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'POS7_v485.7.57_Tablet_Test.html'
      - 'POS7_v485.7.57_Owner_Phone_Test.html'
      - 'POS7_v485.7.57_Owner_Cloud.sql'
      - 'POS7_v485.7.57_HTML_Test_Versions.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  package-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare the test package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle='POS7_v485.7.57_HTML_Test_Versions.zip'
          if [[ -s "$bundle" ]]; then
            cp "$bundle" dist/
          else
            tablet="$(find . -type f -name 'POS7_v485.7.57_Tablet_Test.html' -print -quit)"
            phone="$(find . -type f -name 'POS7_v485.7.57_Owner_Phone_Test.html' -print -quit)"
            cloud="$(find . -type f -name 'POS7_v485.7.57_Owner_Cloud.sql' -print -quit)"
            if [[ -z "$tablet" || -z "$phone" || -z "$cloud" ]]; then
              echo 'Upload POS7_v485.7.57_HTML_Test_Versions.zip to the repository root, or upload the tablet HTML, phone HTML, and SQL files.' >&2
              exit 1
            fi
            zip -j "dist/$bundle" "$tablet" "$phone" "$cloud"
          fi
          unzip -t "dist/$bundle"

      - name: Upload HTML test versions
        uses: actions/upload-artifact@v4
        with:
          name: POS7-v485.7.57-HTML-test-versions
          path: dist/POS7_v485.7.57_HTML_Test_Versions.zip
          if-no-files-found: error
          retention-days: 14
