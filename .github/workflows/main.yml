name: Build POS7 Tablet v485.7.229 R204
on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: 'Optional real installed tablet APK versionCode'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract and verify tablet source
        run: |
          python3 - <<'PY2'
          import zipfile,pathlib
          outer=zipfile.ZipFile('POS7_R204_Build_Ready.zip')
          nested='POS7_Tablet_v485.7.229_R204_Project.zip'
          if nested not in outer.namelist(): raise SystemExit('R204 project missing inside build bundle')
          import io
          z=zipfile.ZipFile(io.BytesIO(outer.read(nested)));dest=pathlib.Path('android-project').resolve()
          for i in z.infolist():
              if not (dest/i.filename).resolve().is_relative_to(dest): raise SystemExit('Unsafe ZIP path')
          z.extractall(dest)
          app=dest/'POS7_Tablet';h=(app/'app/src/main/assets/index.html').read_text()
          g=(app/'app/build.gradle').read_text()
          assert 'publisher_device' in h and 'pos7_inventory_commit_r155' in h
          assert "applicationId 'com.sokkarzeyedeh.pos7'" in g
          assert "versionName '485.7.229-r204'" in g
          print('R204 tablet source verified')
          PY2
      - name: Check HTML JavaScript syntax
        run: |
          python3 - <<'PY2'
          from html.parser import HTMLParser
          import subprocess,pathlib
          class P(HTMLParser):
              def __init__(self): super().__init__();self.active=False;self.s=[]
              def handle_starttag(self,t,a):
                  if t=='script': self.active=True;self.s.append('')
              def handle_endtag(self,t):
                  if t=='script':self.active=False
              def handle_data(self,d):
                  if self.active:self.s[-1]+=d
          p=P();p.feed(pathlib.Path('android-project/POS7_Tablet/app/src/main/assets/index.html').read_text())
          for i,s in enumerate(p.s):
              if s.strip():
                  r=subprocess.run(['node','--check'],input=s,text=True,capture_output=True)
                  if r.returncode:raise SystemExit(f'Script {i}: {r.stderr}')
          PY2
      - name: Set upgrade versionCode
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          python3 - <<'PY2'
          import os
          raw=os.getenv('INSTALLED_CODE','').strip()
          if raw and (not raw.isascii() or not raw.isdecimal()):raise SystemExit('Invalid installed code')
          code=max(2000000000+int(os.environ['GITHUB_RUN_NUMBER']),int(raw)+1 if raw else 0)
          if code>2100000000:raise SystemExit('versionCode exceeds Android limit')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'POS7_VERSION_CODE={code}\n')
          print('New tablet versionCode:',code)
          PY2
      - name: Verify original tablet release signing certificate
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for k in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do test -n "${!k:-}" || { echo "Missing secret $k"; exit 1; }; done
          umask 077
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pos7-tablet-release.jks"
          actual=$(keytool -exportcert -keystore "$RUNNER_TEMP/pos7-tablet-release.jks" -storepass:env POS7_KEYSTORE_PASSWORD -alias "$POS7_KEY_ALIAS" | sha256sum | awk '{print $1}')
          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'
          test "$actual" = "$expected" || { echo 'Original tablet signing certificate mismatch'; exit 1; }
          echo "POS7_KEYSTORE_PATH=$RUNNER_TEMP/pos7-tablet-release.jks" >> "$GITHUB_ENV"
          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"
      - name: Build signed tablet APK
        working-directory: android-project/POS7_Tablet
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease
      - name: Verify final APK and package
        run: |
          set -euo pipefail
          apk=android-project/POS7_Tablet/app/build/outputs/apk/release/app-release.apk
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk/apksigner" verify --verbose "$apk"
          "$sdk/aapt" dump badging "$apk" | grep -F "package: name='com.sokkarzeyedeh.pos7' versionCode='$POS7_VERSION_CODE' versionName='485.7.229-r204'"
          actual=$("$sdk/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$POS7_SIGNING_CERT_SHA256"
          mkdir -p output
          cp "$apk" output/POS7_Tablet_v485.7.229-R204.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
          printf 'versionName=485.7.229-r204\nversionCode=%s\n' "$POS7_VERSION_CODE" > output/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: POS7-Tablet-v485.7.229-R204-${{ env.POS7_VERSION_CODE }}
          path: output/
          if-no-files-found: error
      - name: Delete temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pos7-tablet-release.jks"
