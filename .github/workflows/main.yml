
name: Build POS7 Tablet v485.7.191

on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: 'Actual versionCode of installed tablet APK (enter if higher than default)'
        required: false
        default: '48508230'
        type: string
  push:
    branches: [main]
    paths:
      - 'POS7_Tablet_v485.7.191_GitHub_APK_Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract and check POS7 source
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('POS7_Tablet_v485.7.191_GitHub_APK_Project.zip')
          if not archive.is_file():
              raise SystemExit('Project ZIP is missing from repository root')
          target = Path('android-project').resolve()
          with ZipFile(archive) as z:
              for item in z.infolist():
                  dest = (target / item.filename).resolve()
                  if not dest.is_relative_to(target):
                      raise SystemExit('Unsafe ZIP path: ' + item.filename)
              z.extractall(target)
          root = target / 'POS7_Tablet'
          gradle = (root / 'app/build.gradle').read_text('utf-8')
          html = (root / 'app/src/main/assets/index.html').read_text('utf-8')
          manifest = (root / 'app/src/main/AndroidManifest.xml').read_text('utf-8')
          checks = {
              'package': "applicationId 'com.sokkarzeyedeh.pos7'" in gradle,
              'version': "versionName '485.7.191'" in gradle,
              'HTML version': "POS7_APP_VERSION='485.7.191'" in html,
              'tablet configuration persistence': 'smallestScreenSize|screenLayout' in manifest,
              'three sale baskets': 'pos173-three-baskets' in html,
              'safe sync': 'pos187-safe-navigation-and-sync' in html,
              'midnight-date correction': 'pos188-midnight-date-guard' in html,
              'supplier quick item list': 'pos189SupplierPanel' in html,
              'purchase return action': 'pos190BackToPurchaseItems' in html,
              'centered purchase buttons': 'pos191-center-purchase-actions' in html,
              'backup support': 'saveIndependentBackup' in html,
              'cloud sync diagnostics': 'pos177SyncDiagnostics' in html,
              'release signing guard': 'Original POS7 signing secrets required' in gradle,
          }
          for label, ok in checks.items():
              if not ok:
                  raise SystemExit('Source check failed: ' + label)
          print('POS7 source v485.7.191 verified')
          PYEXTRACT

      - name: Validate source and run regressions
        working-directory: android-project/POS7_Tablet
        run: |
          set -euo pipefail
          python3 ci/validate.py
          node ci/test_sync.js
          node ci/test_stable_compare.js
          node ci/test_backup_folder.js
          node ci/test_save_profile.js
          node ci/test_auto_sync_v186.js
          node ci/test_navigation_v188.js
          node ci/test_midnight_v188.js
          node ci/test_return_button_v190.js
          node ci/test_purchase_buttons_v191.js

      - name: Select upgrade-safe versionCode
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os
          raw = os.environ.get('INSTALLED_CODE', '').strip() or '48508230'
          if not raw.isascii() or not raw.isdecimal():
              raise SystemExit('installed_version_code must contain decimal digits')
          code = max(48508231, int(raw) + 1,
                     48508230 + int(os.environ['GITHUB_RUN_NUMBER']))
          if code > 2100000000:
              raise SystemExit('Android versionCode maximum exceeded')
          with open(os.environ['GITHUB_ENV'], 'a') as envfile:
              envfile.write(f'POS7_VERSION_CODE={code}\n')
          print('Release versionCode:', code)
          PYCODE

      - name: Verify original signing certificate
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing GitHub signing secret: $key"
              exit 1
            fi
          done
          umask 077
          keyfile="$RUNNER_TEMP/pos7-original-release.jks"
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'
          actual=$(keytool -exportcert \
            -keystore "$keyfile" \
            -storepass:env POS7_KEYSTORE_PASSWORD \
            -alias "$POS7_KEY_ALIAS" \
            | sha256sum | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            echo 'Original POS7 certificate mismatch: refusing build'
            exit 1
          fi
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"
          echo 'Original signing certificate verified'

      - name: Build release APK with original signature
        working-directory: android-project/POS7_Tablet
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify package, version and final signature
        run: |
          set -euo pipefail
          apk='android-project/POS7_Tablet/app/build/outputs/apk/release/app-release.apk'
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          "$sdk/apksigner" verify --verbose "$apk"
          "$sdk/aapt" dump badging "$apk" > "$RUNNER_TEMP/pos7-badging.txt"
          grep -F "package: name='com.sokkarzeyedeh.pos7' versionCode='$POS7_VERSION_CODE' versionName='485.7.191'" "$RUNNER_TEMP/pos7-badging.txt"
          actual=$("$sdk/apksigner" verify --print-certs "$apk" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' \
            | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ "$actual" != "$POS7_SIGNING_CERT_SHA256" ]]; then
            echo 'Final APK signature differs from original; refusing release'
            exit 1
          fi
          mkdir -p output
          cp "$apk" output/POS7_Tablet_v485.7.191_Purchase_Center_Buttons.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
          printf 'versionName=485.7.191\nversionCode=%s\ncertificateSHA256=%s\n' \
            "$POS7_VERSION_CODE" "$actual" > output/build-info.txt
          echo 'Signed APK passed all checks'

      - name: Publish verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS7-Tablet-v485.7.191-${{ env.POS7_VERSION_CODE }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Delete temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/pos7-original-release.jks"
