name: Build POS7 v485.7.10 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'POS7_v485.7.10_APK_Project/**'
      - 'POS7_v485.7.10_APK_Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project_dir='POS7_v485.7.10_APK_Project'
          if [[ ! -f "$project_dir/settings.gradle" ]]; then
            archive='POS7_v485.7.10_APK_Project.zip'
            if [[ ! -f "$archive" ]]; then
              echo 'Upload POS7_v485.7.10_APK_Project.zip or its extracted folder to the repository root.' >&2
              exit 1
            fi
            mkdir -p android-project
            unzip -q "$archive" -d android-project
            project_dir="$(find android-project -maxdepth 5 -type f -name settings.gradle -print -quit | xargs -r dirname)"
          fi
          test -n "$project_dir"
          test -f "$project_dir/app/build.gradle"
          test -f "$project_dir/app/src/main/assets/index.html"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Check package, version, and embedded sound
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          grep -Fq "applicationId 'com.sokkarzeyedeh.pos7'" "$PROJECT_DIR/app/build.gradle"
          grep -Fq 'versionCode 4850710' "$PROJECT_DIR/app/build.gradle"
          grep -Fq "versionName '485.7.10'" "$PROJECT_DIR/app/build.gradle"
          grep -Fq 'data:audio/mpeg;base64,' "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -Fq 'v485.7.10' "$PROJECT_DIR/app/src/main/assets/index.html"

      - name: Configure signing key
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/pos7-release.jks"
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature and package metadata
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/pos7-badging.txt"
          grep -Fq "name='com.sokkarzeyedeh.pos7'" "$RUNNER_TEMP/pos7-badging.txt"
          grep -Fq "versionCode='4850710'" "$RUNNER_TEMP/pos7-badging.txt"
          grep -Fq "versionName='485.7.10'" "$RUNNER_TEMP/pos7-badging.txt"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: POS7-v485.7.10-release-update-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
