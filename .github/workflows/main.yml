
name: Build POS7 Tablet v485.7.231 SAVE P6

on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: 'Optional installed tablet versionCode'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v4

      - run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract and verify tablet source
        run: |
          python3 - <<'PY2'
          import zipfile,pathlib
          name='POS7_Tablet_v485.7.231_SAVE_P6_Project.zip'
          z=zipfile.ZipFile(name)
          dest=pathlib.Path('android-project').resolve()
          for i in z.infolist():
              if not (dest/i.filename).resolve().is_relative_to(dest):
                  raise SystemExit('Unsafe ZIP path')
          z.extractall(dest)
          app=dest/'POS7_Tablet'
          h=(app/'app/src/main/assets/index.html').read_text()
          g=(app/'app/build.gradle').read_text()
          assert 'publisher_device' in h
          assert 'pos7_inventory_commit_r155' in h
          assert "applicationId 'com.sokkarzeyedeh.pos7'" in g
          assert "versionName '485.7.231-save-p6'" in g
          print('SAVE P6 source verified')
          PY2

      - name: Check HTML JavaScript syntax
        run: |
          python3 - <<'PY2'
          from html.parser import HTMLParser
          import subprocess,pathlib
          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active=False
                  self.s=[]
              def handle_starttag(self,t,a):
                  if t=='script':
                      self.active=True
                      self.s.append('')
              def handle_endtag(self,t):
                  if t=='script':
                      self.active=False
              def handle_data(self,d):
                  if self.active:
                      self.s[-1]+=d
          p=P()
          p.feed(pathlib.Path(
            'android-project/POS7_Tablet/app/src/main/assets/index.html'
          ).read_text())
          for i,s in enumerate(p.s):
              if s.strip():
                  r=subprocess.run(
                    ['node','--check'],
                    input=s,text=True,capture_output=True
                  )
                  if r.returncode:
                      raise SystemExit(f'Script {i}: {r.stderr}')
          print('JavaScript syntax passed')
          PY2

      - name: Test SAVE P6 rendering
        working-directory: android-project/POS7_Tablet
        run: node ci/test_save_p6.js

      - name: Test compressed storage safety
        working-directory: android-project/POS7_Tablet
        run: node ci/test_save_p6_compression.js

      - name: Set upgrade versionCode
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          python3 - <<'PY2'
          import os
          raw=os.getenv('INSTALLED_CODE','').strip()
          if raw and (not raw.isascii() or not raw.isdecimal()):
              raise SystemExit('Invalid versionCode')
          code=max(
              2000000000+int(os.environ['GITHUB_RUN_NUMBER']),
              int(raw)+1 if raw else 0
          )
          if code>2100000000:
              raise SystemExit('versionCode exceeds Android limit')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'POS7_VERSION_CODE={code}\n')
          PY2

      - name: Verify original signing certificate
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for k in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            test -n "${!k:-}" || {
              echo "Missing secret $k"
              exit 1
            }
          done
          umask 077
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pos7-release.jks"
          actual=$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/pos7-release.jks" \
            -storepass:env POS7_KEYSTORE_PASSWORD \
            -alias "$POS7_KEY_ALIAS" \
            | sha256sum | awk '{print $1}')
          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'
          test "$actual" = "$expected" || {
            echo 'Signing certificate mismatch'
            exit 1
          }
          echo "POS7_KEYSTORE_PATH=$RUNNER_TEMP/pos7-release.jks" >> "$GITHUB_ENV"
          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Build signed tablet APK
        working-directory: android-project/POS7_Tablet
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify final APK
        run: |
          set -euo pipefail
          apk=android-project/POS7_Tablet/app/build/outputs/apk/release/app-release.apk
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk/apksigner" verify --verbose "$apk"
          "$sdk/aapt" dump badging "$apk" | grep -F "package: name='com.sokkarzeyedeh.pos7' versionCode='$POS7_VERSION_CODE' versionName='485.7.231-save-p6'"
          actual=$("$sdk/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$POS7_SIGNING_CERT_SHA256"
          mkdir -p output
          cp "$apk" output/POS7_Tablet_SAVE_P6.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: POS7-Tablet-SAVE-P6-${{ env.POS7_VERSION_CODE }}
          path: output/
          if-no-files-found: error

      - name: Delete temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pos7-release.jks"
