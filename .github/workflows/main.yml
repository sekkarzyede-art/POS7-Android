
name: Build POS7 Tablet v485.7.229 R211

on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: 'Optional real installed tablet APK versionCode'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract and verify tablet source
        run: |
          python3 - <<'PY2'
          import zipfile
          import pathlib

          zip_path = pathlib.Path('POS7_Tablet_R211_Android.zip')

          if not zip_path.is_file():
              raise SystemExit(
                  f'Missing Android project ZIP: {zip_path}'
              )

          dest = pathlib.Path('android-project').resolve()

          with zipfile.ZipFile(zip_path) as z:
              for entry in z.infolist():
                  target = (dest / entry.filename).resolve()
                  if not target.is_relative_to(dest):
                      raise SystemExit('Unsafe ZIP path')
              z.extractall(dest)

          app = dest / 'POS7_Tablet'
          html_file = app / 'app/src/main/assets/index.html'
          gradle_file = app / 'app/build.gradle'

          if not html_file.is_file():
              raise SystemExit('Tablet HTML missing in ZIP')

          if not gradle_file.is_file():
              raise SystemExit('Tablet Gradle file missing in ZIP')

          h = html_file.read_text(encoding='utf-8')
          g = gradle_file.read_text(encoding='utf-8')

          assert 'publisher_device' in h
          assert 'pos7_inventory_commit_r155' in h
          assert "applicationId 'com.sokkarzeyedeh.pos7'" in g
          assert "versionName '485.7.229-r211'" in g

          print('R211 tablet source verified')
          PY2

      - name: Check HTML JavaScript syntax
        run: |
          python3 - <<'PY2'
          from html.parser import HTMLParser
          import subprocess
          import pathlib

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.s = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.active = True
                      self.s.append('')

              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.active = False

              def handle_data(self, data):
                  if self.active:
                      self.s[-1] += data

          html = pathlib.Path(
              'android-project/POS7_Tablet/app/src/main/assets/index.html'
          ).read_text(encoding='utf-8')

          parser = P()
          parser.feed(html)

          for i, script in enumerate(parser.s):
              if script.strip():
                  r = subprocess.run(
                      ['node', '--check'],
                      input=script,
                      text=True,
                      capture_output=True
                  )

                  if r.returncode:
                      raise SystemExit(
                          f'Script {i}: {r.stderr}'
                      )

          print('JavaScript syntax verified')
          PY2

      - name: Set upgrade versionCode
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          python3 - <<'PY2'
          import os

          raw = os.getenv('INSTALLED_CODE', '').strip()

          if raw and (not raw.isascii() or not raw.isdecimal()):
              raise SystemExit('Invalid installed code')

          code = max(
              2000000000 + int(os.environ['GITHUB_RUN_NUMBER']),
              int(raw) + 1 if raw else 0
          )

          if code > 2100000000:
              raise SystemExit('versionCode exceeds Android limit')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'POS7_VERSION_CODE={code}\n')

          print('New tablet versionCode:', code)
          PY2

      - name: Verify original tablet release signing certificate
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for k in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            test -n "${!k:-}" || {
              echo "Missing secret $k"
              exit 1
            }
          done

          umask 077

          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pos7-tablet-release.jks"

          actual=$(
            keytool -exportcert \
              -keystore "$RUNNER_TEMP/pos7-tablet-release.jks" \
              -storepass:env POS7_KEYSTORE_PASSWORD \
              -alias "$POS7_KEY_ALIAS" |
              sha256sum |
              awk '{print $1}'
          )

          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'

          test "$actual" = "$expected" || {
            echo 'Original tablet signing certificate mismatch'
            exit 1
          }

          echo "POS7_KEYSTORE_PATH=$RUNNER_TEMP/pos7-tablet-release.jks" >> "$GITHUB_ENV"
          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Build signed tablet APK
        working-directory: android-project/POS7_Tablet
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify final APK and package
        run: |
          set -euo pipefail

          apk=android-project/POS7_Tablet/app/build/outputs/apk/release/app-release.apk
          sdk="$ANDROID_HOME/build-tools/35.0.0"

          "$sdk/apksigner" verify --verbose "$apk"

          "$sdk/aapt" dump badging "$apk" |
            grep -F "package: name='com.sokkarzeyedeh.pos7' versionCode='$POS7_VERSION_CODE' versionName='485.7.229-r211'"

          actual=$(
            "$sdk/apksigner" verify --print-certs "$apk" |
              awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )

          test "$actual" = "$POS7_SIGNING_CERT_SHA256"

          mkdir -p output

          cp "$apk" output/POS7_Tablet_v485.7.229-R211.apk

          sha256sum output/*.apk > output/SHA256SUMS.txt

          printf 'versionName=485.7.229-r211\nversionCode=%s\n' \
            "$POS7_VERSION_CODE" > output/build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: POS7-Tablet-v485.7.229-R211-${{ env.POS7_VERSION_CODE }}
          path: output/
          if-no-files-found: error

      - name: Delete temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pos7-tablet-release.jks"
