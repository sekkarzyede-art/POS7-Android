
name: Build POS7 Tablet Keystore Stage 1

on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: "Current installed APK versionCode"
        required: false
        default: "48508395"
        type: string

  push:
    branches: [main]
    paths:
      - 'POS7_Tablet_v485.7.207_Keystore_Module_Stage1_Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Extract and validate project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path(
              "POS7_Tablet_v485.7.207_Keystore_Module_Stage1_Project.zip"
          )

          if not archive.is_file():
              raise SystemExit("Project ZIP not found")

          root = Path("android-project").resolve()

          with ZipFile(archive) as z:
              for item in z.infolist():
                  target = (root / item.filename).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit("Unsafe ZIP entry")
              z.extractall(root)

          project = root / "POS7_Tablet"

          required = [
              "settings.gradle",
              "app/build.gradle",
              "app/src/main/AndroidManifest.xml",
              "app/src/main/assets/index.html",
              "app/src/main/java/com/sokkarzeyedeh/pos7/MainActivity.java",
              "app/src/main/java/com/sokkarzeyedeh/pos7/Pos7DeviceIdentity.java",
          ]

          for name in required:
              if not (project / name).is_file():
                  raise SystemExit("Missing: " + name)

          gradle = (
              project / "app/build.gradle"
          ).read_text("utf-8")

          html = (
              project / "app/src/main/assets/index.html"
          ).read_text("utf-8")

          identity = (
              project /
              "app/src/main/java/com/sokkarzeyedeh/pos7/Pos7DeviceIdentity.java"
          ).read_text("utf-8")

          assert "com.sokkarzeyedeh.pos7" in gradle
          assert "versionName '485.7.207'" in gradle
          assert "POS7_APP_VERSION='485.7.207'" in html
          assert "AndroidKeyStore" in identity
          assert "secp256r1" in identity

          print("POS7 project validation passed")
          PY

      - name: Configure upgrade-safe versionCode
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          raw = os.environ.get(
              "INSTALLED_CODE", ""
          ).strip() or "48508395"

          if not raw.isascii() or not raw.isdecimal():
              raise SystemExit("Invalid installed versionCode")

          code = max(
              48508396,
              int(raw) + 1,
              48508395 + int(os.environ["GITHUB_RUN_NUMBER"])
          )

          if code > 2100000000:
              raise SystemExit("Android versionCode limit exceeded")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"POS7_VERSION_CODE={code}\n")

          print("New versionCode:", code)
          PY

      - name: Configure original signing
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in \
            POS7_KEYSTORE_BASE64 \
            POS7_KEYSTORE_PASSWORD \
            POS7_KEY_ALIAS \
            POS7_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing signing secret: $name"
              exit 1
            fi
          done

          keyfile="$RUNNER_TEMP/pos7-release.jks"

          printf '%s' "$POS7_KEYSTORE_BASE64" \
            | base64 --decode > "$keyfile"

          test -s "$keyfile"

          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"

          keytool -list -v \
            -keystore "$keyfile" \
            -storepass "$POS7_KEYSTORE_PASSWORD" \
            -alias "$POS7_KEY_ALIAS" \
            > "$RUNNER_TEMP/certificate.txt"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          certificate = Path(
              os.environ["RUNNER_TEMP"]
          ) / "certificate.txt"

          content = certificate.read_text("utf-8")

          expected = (
              "843ED618B18EC7A0CB5B0F3898437454"
              "0DA016C41A8DF8042BB8DB19964D4495"
          )

          match = re.search(
              r"SHA256:\s*([0-9A-Fa-f:]+)",
              content
          )

          if not match:
              raise SystemExit(
                  "Signing certificate SHA256 not found"
              )

          actual = (
              match.group(1)
              .replace(":", "")
              .upper()
          )

          print("Actual signing SHA256:", actual)
          print("Expected signing SHA256:", expected)

          if actual != expected:
              raise SystemExit(
                  "Original signing certificate mismatch"
              )

          print("Original signing certificate verified")
          PY

      - name: Build signed release APK
        working-directory: android-project/POS7_Tablet
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Verify APK signature and package
        run: |
          set -euo pipefail

          APK="android-project/POS7_Tablet/app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose --print-certs "$APK" \
            > "$RUNNER_TEMP/apk-signature.txt"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          content = (
              Path(os.environ["RUNNER_TEMP"]) /
              "apk-signature.txt"
          ).read_text("utf-8")

          expected = (
              "843ED618B18EC7A0CB5B0F3898437454"
              "0DA016C41A8DF8042BB8DB19964D4495"
          )

          match = re.search(
              r"certificate SHA-256 digest:\s*([0-9a-fA-F:]+)",
              content,
              re.I
          )

          if not match:
              raise SystemExit("APK signer not found")

          actual = match.group(1).replace(":", "").upper()

          if actual != expected:
              raise SystemExit(
                  "APK signing certificate mismatch"
              )

          print("APK signature verified")
          PY

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" | head -5

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: POS7_Tablet_v485.7.207_Keystore_Stage1
          path: android-project/POS7_Tablet/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
