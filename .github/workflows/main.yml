name: Build POS7 Owner Phone APK v485.7.119 (HTML 485.7.109)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*Owner*Phone*.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build-owner-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          yes | sdkmanager --licenses >/dev/null || true

      - name: Find and extract owner phone project
        id: extract
        run: |
          set -euo pipefail
          expected_code='48507119'
          matches=()
          while IFS= read -r -d '' archive; do
            entries="$(unzip -Z1 "$archive")"
            main_entry="$(printf '%s\n' "$entries" | grep -E '(^|/)app/src/main/java/com/sokkarzeyedeh/pos7owner/MainActivity.java$' | head -n 1 || true)"
            gradle_entry="$(printf '%s\n' "$entries" | grep -E '(^|/)app/build.gradle$' | head -n 1 || true)"
            if [[ -n "$main_entry" && -n "$gradle_entry" ]] && unzip -p "$archive" "$gradle_entry" | grep -Eq "versionCode[[:space:]]+$expected_code"; then
              matches+=("$archive")
            fi
          done < <(find . -type f -iname '*.zip' ! -path './.git/*' -print0)
          if [[ ${#matches[@]} -ne 1 ]]; then
            echo "Expected exactly one owner phone project ZIP for version $expected_code; found ${#matches[@]}." >&2
            echo 'Upload the POS7_Owner_Phone_v485.7.119_APK_Project.zip file to the repository root, then rerun this workflow.' >&2
            find . -type f -iname '*.zip' ! -path './.git/*' -print >&2
            exit 1
          fi
          archive="${matches[0]}"
          echo "Using project archive: $archive"
          mkdir -p android-project
          unzip -oq "$archive" -d android-project
          settings_file="$(find android-project -type f -name settings.gradle -print -quit)"
          if [[ -z "$settings_file" ]]; then
            echo 'The ZIP was found, but it does not contain settings.gradle.' >&2
            exit 1
          fi
          project_dir="${settings_file%/settings.gradle}"
          test -f "$project_dir/app/src/main/assets/index.html"
          test -f "$project_dir/app/src/main/java/com/sokkarzeyedeh/pos7owner/MainActivity.java"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "apk_path=$project_dir/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"

      - name: Configure Firebase for FCM
        env:
          POS7_FIREBASE_JSON_BASE64: ${{ secrets.POS7_FIREBASE_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${POS7_FIREBASE_JSON_BASE64:-}" ]]; then
            echo 'Missing GitHub Actions secret: POS7_FIREBASE_JSON_BASE64' >&2
            exit 1
          fi
          project_dir="$(find android-project -type f -name settings.gradle -print -quit)"
          project_dir="${project_dir%/settings.gradle}"
          printf '%s' "$POS7_FIREBASE_JSON_BASE64" | base64 --decode > "$project_dir/app/google-services.json"
          test -s "$project_dir/app/google-services.json"
          python3 - "$project_dir/app/google-services.json" <<'PYJSON'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          packages=[x.get('client_info',{}).get('android_client_info',{}).get('package_name') for x in data.get('client',[])]
          if 'com.sokkarzeyedeh.pos7owner' not in packages:
              raise SystemExit('Firebase google-services.json does not include com.sokkarzeyedeh.pos7owner')
          PYJSON

      - name: Configure and verify POS7 signing key
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/pos7-release.jks"
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          keytool -list -keystore "$keyfile" -storepass "$POS7_KEYSTORE_PASSWORD" -alias "$POS7_KEY_ALIAS" >/dev/null
          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'
          actual=$(keytool -exportcert -keystore "$keyfile" -storepass "$POS7_KEYSTORE_PASSWORD" -alias "$POS7_KEY_ALIAS" | sha256sum | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            echo 'Signing key certificate does not match the verified POS7 certificate.' >&2
            exit 1
          fi
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Build signed owner phone APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK package, version, and signing certificate
        env:
          APK_PATH: ${{ steps.extract.outputs.apk_path }}
          POS7_SIGNING_CERT_SHA256: ${{ env.POS7_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_PATH")
          printf '%s\n' "$badging" | grep -Fq "package: name='com.sokkarzeyedeh.pos7owner' versionCode='48507119' versionName='485.7.119'"
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK_PATH" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ "$actual" != "$POS7_SIGNING_CERT_SHA256" ]]; then
            echo 'APK signer differs from the configured POS7 signing key.' >&2
            exit 1
          fi

      - name: Upload signed owner phone APK
        uses: actions/upload-artifact@v4
        with:
          name: POS7-Owner-Phone-v485.7.119-apk
          path: ${{ steps.extract.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
