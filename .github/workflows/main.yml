name: POS7 TABLET 485.7.228 R50 - PHOTO BARCODE FALLBACK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main.yml'
      - 'POS7_Tablet_v485.7.228_R50_COMPLETE_PROJECT.zip'
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: "Installed Android versionCode (optional, not versionName)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack exact R50 archive and refuse old sources
        shell: bash
        run: |
          set -euo pipefail
          archive='POS7_Tablet_v485.7.228_R50_COMPLETE_PROJECT.zip'
          test -f "$archive" || { echo "ERROR: R50 ZIP is not uploaded to repository root"; exit 1; }
          printf '%s  %s\n' 'a80645c23cfb5c25db27878f246c904d8d734ba1f7f324cb2d89774aed563f83' "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pos7-r50"
          unzip -q "$archive" -d "$RUNNER_TEMP/pos7-r50"
          test -f "$RUNNER_TEMP/pos7-r50/POS7_Tablet/app/build.gradle"
          test -f "$RUNNER_TEMP/pos7-r50/POS7_Tablet/app/src/main/assets/index.html"
          echo "POS7_SOURCE=$RUNNER_TEMP/pos7-r50/POS7_Tablet" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/pos7-r50/POS7_Tablet" <<'PYVERIFY'
          import sys,re
          from pathlib import Path
          p=Path(sys.argv[1]); h=(p/'app/src/main/assets/index.html').read_text(); g=(p/'app/build.gradle').read_text()
          import hashlib
          assert hashlib.sha256((p/'app/src/main/assets/index.html').read_bytes()).hexdigest() == '878b5717784a6b192f6e61becbc9d07cf7c0e088018646479aec0c1b5f2ed806', 'SOURCE HTML CHANGED'
          assert "window.POS7_APP_VERSION='485.7.228'" in h, 'WRONG HTML VERSION' 
          assert 'const localPid=String(product.id)' in h, 'R50 BARCODE FALLBACK MISSING'
          assert 'pos7-photo-sync-r34' in h and 'pos7PhotoRun' in h and 'pos7OpenPhotoCard' in h, 'PHOTO CARD MISSING'
          assert "versionName '485.7.228'" in g, 'WRONG ANDROID VERSION'
          assert "applicationId 'com.sokkarzeyedeh.pos7'" in g, 'WRONG PACKAGE'
          print('VERIFIED: 228 + R50 diagnostic + original package')
          PYVERIFY
      - name: Validate JavaScript in R36 HTML
        run: cd "$POS7_SOURCE" && python3 ci/validate.py
      - name: Verify original signing key before build
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for x in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            test -n "${!x:-}" || { echo "Missing original secret: $x"; exit 1; }
          done
          umask 077
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pos7-original.jks"
          cert=$(keytool -exportcert -keystore "$RUNNER_TEMP/pos7-original.jks" -storepass:env POS7_KEYSTORE_PASSWORD -alias "$POS7_KEY_ALIAS" | sha256sum | awk '{print $1}')
          test "$cert" = '843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495' || { echo 'WRONG SIGNER: build refused'; exit 1; }
          echo "POS7_KEYSTORE_PATH=$RUNNER_TEMP/pos7-original.jks" >> "$GITHUB_ENV"
          echo "POS7_EXPECTED_CERT=$cert" >> "$GITHUB_ENV"
      - name: Determine update-safe versionCode
        shell: bash
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os
          raw=(os.getenv('INSTALLED_CODE') or '').strip()
          if raw and (not raw.isascii() or not raw.isdecimal()):
              raise SystemExit('Invalid installed versionCode')
          # Original successful v485.7.209 reference uses 48508396 as its baseline.
          # R39 run #167 may already be 48508409, so do not assume versionCode
          # alone caused installation failure.
          code=max(48510000+int(os.environ['GITHUB_RUN_NUMBER']),48508396+1,int(raw)+1 if raw else 0)
          if code>2100000000:raise SystemExit('versionCode exceeds Android limit')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'POS7_VERSION_CODE={code}\n')
          print('Original 209 baseline versionCode: 48508396')
          print('New candidate versionCode:',code)
          print('This does not establish the actual installed device versionCode.')
          PYCODE
      - name: Build signed APK only from R50 archive
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$POS7_SOURCE"
          gradle --no-daemon clean assembleRelease
      - name: Verify APK metadata, signature, embedded photo card
        shell: bash
        run: |
          set -euo pipefail
          apk="$POS7_SOURCE/app/build/outputs/apk/release/app-release.apk"
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          "$sdk/apksigner" verify --verbose "$apk"
          "$sdk/aapt" dump badging "$apk" | grep -F "package: name='com.sokkarzeyedeh.pos7' versionCode='$POS7_VERSION_CODE' versionName='485.7.228'"
          cert=$("$sdk/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$cert" = "$POS7_EXPECTED_CERT"
          # Avoid grep -q / SIGPIPE failures under pipefail when assets/index.html is large.
          python3 - "$apk" <<'PYASSET'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z: h=z.read('assets/index.html').decode('utf-8')
          assert "window.POS7_APP_VERSION='485.7.228'" in h, 'WRONG APK HTML VERSION'
          assert 'const localPid=String(product.id)' in h, 'R50 BARCODE FALLBACK MISSING'
          assert 'pos7-photo-sync-r34' in h and 'pos7OpenPhotoCard' in h and 'pos7PhotoRun' in h, 'MISSING PHOTO CARD IN APK'
          print('APK HTML verified: 485.7.228 + photo sync R34')
          PYASSET
          mkdir -p output
          cp "$apk" output/POS7_TABLET_v485.7.228_R50_VERIFIED.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
          printf 'ANDROID_VERSION_CODE=%s\\nORIGINAL_209_BASELINE=48508396\\nSIGNING_CERT_SHA256=%s\\n' "$POS7_VERSION_CODE" "$cert" > output/INSTALL_AUDIT.txt
          printf 'APP=POS7 Tablet\nVERSION=485.7.228\nSOURCE=R50 ZIP SHA256 a80645c23cfb5c25db27878f246c904d8d734ba1f7f324cb2d89774aed563f83\nAPPLIED=Photo R34 + guarded unique barcode fallback R50\nSIGNED=Original certificate checked\nGITHUB_RUN=%s\n' "$GITHUB_RUN_ID" > output/VERIFIED_BUILD.txt
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pos7-original.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: POS7-TABLET-228-R50-VERIFIED-ONLY
          path: output/
          if-no-files-found: error
