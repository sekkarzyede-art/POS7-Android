
name: Build POS7 Owner Phone 485.7.130 Notifications

on:
  workflow_dispatch:
    inputs:
      installed_version_code:
        description: "Current installed APK versionCode"
        required: false
        default: "48507254"
        type: string

  push:
    branches: [main]
    paths:
      - 'POS7_Phone_130.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Extract phone project
        run: |
          set -euo pipefail
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          import zipfile

          source = Path('POS7_Phone_130.zip')
          target = Path('android-project').resolve()

          if not source.is_file():
              raise SystemExit('Missing POS7_Phone_130.zip')

          with zipfile.ZipFile(source) as z:
              for item in z.infolist():
                  dest = (target / item.filename).resolve()
                  if not dest.is_relative_to(target):
                      raise SystemExit('Unsafe ZIP path')
              z.extractall(target)

          root = target / 'POS7_Owner_Phone'
          gradle = (root / 'app/build.gradle').read_text()
          html = (root / 'app/src/main/assets/index.html').read_text()
          manifest = (root / 'app/src/main/AndroidManifest.xml').read_text()

          assert "applicationId 'com.sokkarzeyedeh.pos7owner'" in gradle
          assert "versionName '485.7.130-blue'" in gradle

          assert 'cashPurchasePartyByPayment' in html
          assert 'shareImageBase64' in html
          assert 'dailyProfitCard()+dailyCashCard()+dailyWalletCard()' in html

          java = root / (
              'app/src/main/java/com/sokkarzeyedeh/'
              'pos7owner'
          )

          assert (java / 'Pos7MessagingService.java').is_file()
          assert 'testNativeNotifications' in (
              java / 'MainActivity.java'
          ).read_text()

          assert (
              'com.google.firebase.messaging.'
              'default_notification_channel_id'
          ) in manifest

          print('POS7 phone project verified')
          PYEXTRACT

      - name: Set upgrade-compatible versionCode
        env:
          INSTALLED_CODE: ${{ inputs.installed_version_code }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import os

          raw = (
              os.environ.get('INSTALLED_CODE', '').strip()
              or '48507254'
          )

          if not raw.isascii() or not raw.isdecimal():
              raise SystemExit('Invalid installed versionCode')

          code = max(
              48507255 + int(os.environ['GITHUB_RUN_NUMBER']),
              int(raw) + 1
          )

          if code > 2100000000:
              raise SystemExit('versionCode too large')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'POS7_VERSION_CODE={code}\n')

          print('New versionCode:', code)
          PYCODE

      - name: Configure original Firebase
        env:
          POS7_FIREBASE_JSON_BASE64: ${{ secrets.POS7_FIREBASE_JSON_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${POS7_FIREBASE_JSON_BASE64:-}" ]]; then
            echo 'Missing POS7_FIREBASE_JSON_BASE64'
            exit 1
          fi

          printf '%s' "$POS7_FIREBASE_JSON_BASE64" \
            | base64 --decode \
            > android-project/POS7_Owner_Phone/app/google-services.json

          python3 - <<'PYFIREBASE'
          import json

          path = (
              'android-project/POS7_Owner_Phone/'
              'app/google-services.json'
          )

          with open(path) as f:
              data = json.load(f)

          project = data.get(
              'project_info', {}
          ).get('project_id')

          packages = [
              c.get('client_info', {})
               .get('android_client_info', {})
               .get('package_name')
              for c in data.get('client', [])
          ]

          if project != 'pos7-owner-notifications':
              raise SystemExit('Firebase project mismatch')

          if 'com.sokkarzeyedeh.pos7owner' not in packages:
              raise SystemExit('Firebase package mismatch')

          print('Original Firebase configuration verified')
          PYFIREBASE

      - name: Verify original signing certificate
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for key in \
            POS7_KEYSTORE_BASE64 \
            POS7_KEYSTORE_PASSWORD \
            POS7_KEY_ALIAS \
            POS7_KEY_PASSWORD
          do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing signing secret: $key"
              exit 1
            fi
          done

          keyfile="$RUNNER_TEMP/pos7-release.jks"
          umask 077

          printf '%s' "$POS7_KEYSTORE_BASE64" \
            | base64 --decode > "$keyfile"

          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'

          actual=$(keytool -exportcert \
            -keystore "$keyfile" \
            -storepass:env POS7_KEYSTORE_PASSWORD \
            -alias "$POS7_KEY_ALIAS" \
            | sha256sum \
            | awk '{print $1}')

          if [[ "$actual" != "$expected" ]]; then
            echo 'Wrong signing certificate'
            echo 'Refusing incompatible update'
            exit 1
          fi

          echo "POS7_KEYSTORE_PATH=$keyfile" \
            >> "$GITHUB_ENV"

          echo "POS7_SIGNING_CERT_SHA256=$actual" \
            >> "$GITHUB_ENV"

          echo 'Original POS7 signing certificate verified'

      - name: Build signed release APK
        working-directory: android-project/POS7_Owner_Phone
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean assembleRelease

      - name: Verify APK package and signature
        run: |
          set -euo pipefail

          apk='android-project/POS7_Owner_Phone/app/build/outputs/apk/release/app-release.apk'

          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"

          test -f "$apk"

          "$sdk_tools/apksigner" verify \
            --verbose "$apk"

          "$sdk_tools/aapt" dump badging "$apk" \
            > "$RUNNER_TEMP/pos7-badging.txt"

          grep -F \
            "package: name='com.sokkarzeyedeh.pos7owner' versionCode='$POS7_VERSION_CODE' versionName='485.7.130-blue'" \
            "$RUNNER_TEMP/pos7-badging.txt"

          actual=$("$sdk_tools/apksigner" \
            verify --print-certs "$apk" \
            | awk -F': ' \
              '/Signer #1 certificate SHA-256 digest:/ {print $2}' \
            | tr -d ':[:space:]' \
            | tr '[:upper:]' '[:lower:]')

          if [[ "$actual" != "$POS7_SIGNING_CERT_SHA256" ]]; then
            echo 'Final APK signature mismatch'
            exit 1
          fi

          mkdir -p output

          cp "$apk" \
            output/POS7_Owner_Phone_v485.7.130_Notifications.apk

          sha256sum output/*.apk \
            > output/SHA256SUMS.txt

          printf \
            'versionName=485.7.130-blue\nversionCode=%s\ncertificateSHA256=%s\n' \
            "$POS7_VERSION_CODE" "$actual" \
            > output/build-info.txt

          echo 'Signed APK verified successfully'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS7-Owner-Phone-485.7.130-${{ env.POS7_VERSION_CODE }}
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/pos7-release.jks"
          rm -f android-project/POS7_Owner_Phone/app/google-services.json
