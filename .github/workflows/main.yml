name: Build POS7 v489 signed update APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل ملفات المستودع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: تحديد وفك مشروع Android
        id: project
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/POS7_v489_APK_Project.zip"
          if [[ ! -f "$archive" ]]; then
            archive="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name 'POS7_v489_APK_Project.zip' -print -quit)"
          fi

          if [[ -n "$archive" && -f "$archive" ]]; then
            unpack="$RUNNER_TEMP/pos7-v489-project"
            rm -rf "$unpack"
            mkdir -p "$unpack"
            unzip -q "$archive" -d "$unpack"
            settings_file="$(find "$unpack" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [[ -z "$settings_file" ]]; then
              echo 'ZIP لا يحتوي ملف settings.gradle؛ ارفع ZIP مشروع Android الكامل.' >&2
              exit 1
            fi
            project_dir="$(dirname "$settings_file")"
          elif [[ -f "$GITHUB_WORKSPACE/settings.gradle" && -f "$GITHUB_WORKSPACE/app/build.gradle" ]]; then
            project_dir="$GITHUB_WORKSPACE"
          else
            settings_file="$(find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [[ -n "$settings_file" && -f "$(dirname "$settings_file")/app/build.gradle" ]]; then
              project_dir="$(dirname "$settings_file")"
            else
              echo 'لم أجد ZIP مشروع v489 أو مجلد Gradle كاملاً. ارفع POS7_v489_APK_Project.zip إلى جذر المستودع.' >&2
              exit 1
            fi
          fi

          if [[ ! -f "$project_dir/app/src/main/assets/index.html" ]]; then
            echo 'ملف app/src/main/assets/index.html غير موجود داخل مشروع Android.' >&2
            exit 1
          fi
          if ! grep -Fq "applicationId 'com.sokkarzeyedeh.pos7'" "$project_dir/app/build.gradle"; then
            echo 'معرّف التطبيق غير مطابق؛ أوقف البناء لحماية التثبيت كتحديث.' >&2
            exit 1
          fi
          if ! grep -Eq 'versionCode[[:space:]]+489([[:space:]]|$)' "$project_dir/app/build.gradle"; then
            echo 'المشروع ليس إصدار v489 المتوقع (versionCode 489).' >&2
            exit 1
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: إعداد والتحقق من مفتاح التوقيع الثابت
        shell: bash
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$POS7_KEYSTORE_BASE64" || -z "$POS7_KEYSTORE_PASSWORD" || -z "$POS7_KEY_ALIAS" || -z "$POS7_KEY_PASSWORD" ]]; then
            echo 'أسرار التوقيع الأربعة غير مكتملة. أضف مفاتيح POS7_KEYSTORE_BASE64 وPOS7_KEYSTORE_PASSWORD وPOS7_KEY_ALIAS وPOS7_KEY_PASSWORD.' >&2
            echo 'للتحديث فوق التطبيق القديم، يجب أن تكون هذه الأسرار من مفتاح التوقيع نفسه الذي استُخدم للتطبيق المثبت.' >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/pos7-release.jks"
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -keystore "$keystore" -storepass "$POS7_KEYSTORE_PASSWORD" -alias "$POS7_KEY_ALIAS" >/dev/null
          echo "POS7_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: إعداد Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بناء APK موقّع للتحديث
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: التحقق من APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk"

      - name: حفظ APK للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: POS7-v489-release-update-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
