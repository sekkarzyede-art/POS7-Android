name: Build POS7 v476 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل ملفات المستودع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: فك مشروع Android من ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/POS7_v476_APK_Project.zip"
          unpack="$GITHUB_WORKSPACE/pos7-v476-build-input"
          if [[ -f "$archive" ]]; then
            rm -rf "$unpack"
            mkdir -p "$unpack"
            unzip -q "$archive" -d "$unpack"
            settings_file="$(find "$unpack" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [[ -z "$settings_file" ]]; then
              echo 'ملف ZIP لا يحتوي settings.gradle.' >&2
              exit 1
            fi
            project_dir="$(dirname "$settings_file")"
          elif [[ -f "$GITHUB_WORKSPACE/settings.gradle" && -f "$GITHUB_WORKSPACE/app/build.gradle" ]]; then
            project_dir="$GITHUB_WORKSPACE"
          else
            echo 'لم أجد POS7_v476_APK_Project.zip في جذر المستودع أو مشروع Gradle كاملاً.' >&2
            echo 'ارفع ZIP إلى جذر المستودع، وضع هذا الملف في .github/workflows/main.yml.' >&2
            exit 1
          fi
          if [[ ! -f "$project_dir/app/src/main/assets/index.html" ]]; then
            echo "ملف التطبيق غير موجود داخل: $project_dir" >&2
            exit 1
          fi
          if ! grep -q 'versionCode 476' "$project_dir/app/build.gradle"; then
            echo 'الملف المضغوط ليس مشروع v476 المتوقع.' >&2
            exit 1
          fi
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "مجلد البناء: $project_dir"

      - name: إعداد Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بناء APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: حفظ APK للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: POS7-v476-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
