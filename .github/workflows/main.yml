name: Build POS7 v485 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'POS7_v485_APK_Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android project
        run: unzip -q POS7_v485_APK_Project.zip -d android-project

      - name: Configure signing key
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/pos7-release.jks"
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android-project/POS7_v485_APK_Project
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        run: |
          apk='android-project/POS7_v485_APK_Project/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: POS7-v485-release-update-apk
          path: android-project/POS7_v485_APK_Project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
