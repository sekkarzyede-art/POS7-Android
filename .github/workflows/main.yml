name: Build POS7 Owner Phone v485.7.105 Push Notifications APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'POS7_Owner_Phone_v485.7.105_Report_Search_APK_Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build-owner-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract project and configure Firebase client
        env:
          POS7_FIREBASE_JSON_BASE64: ${{ secrets.POS7_FIREBASE_JSON_BASE64 }}
        run: |
          set -euo pipefail
          archive='POS7_Owner_Phone_v485.7.105_Report_Search_APK_Project.zip'
          test -s "$archive"
          mkdir -p android-project
          unzip -q "$archive" -d android-project
          project='android-project/POS7_Owner_Phone_v485.7.105_Report_Search_APK_Project'
          test -f "$project/settings.gradle"
          test -f "$project/app/src/main/assets/index.html"
          grep -Fq 'هاتف المالك 485.7.105' "$project/app/src/main/assets/index.html"
          grep -Fq "applicationId 'com.sokkarzeyedeh.pos7owner'" "$project/app/build.gradle"
          grep -Fq 'versionCode 48507105' "$project/app/build.gradle"
          if [[ -z "$POS7_FIREBASE_JSON_BASE64" ]]; then
            echo 'Missing GitHub Actions secret POS7_FIREBASE_JSON_BASE64.' >&2
            exit 1
          fi
          printf '%s' "$POS7_FIREBASE_JSON_BASE64" | base64 --decode > "$project/app/google-services.json"
          test -s "$project/app/google-services.json"
          jq -e '.client[] | select(.client_info.android_client_info.package_name == "com.sokkarzeyedeh.pos7owner")' "$project/app/google-services.json" >/dev/null

      - name: Configure and verify existing POS7 signing key
        env:
          POS7_KEYSTORE_BASE64: ${{ secrets.POS7_KEYSTORE_BASE64 }}
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keyfile="$RUNNER_TEMP/pos7-release.jks"
          for key in POS7_KEYSTORE_BASE64 POS7_KEYSTORE_PASSWORD POS7_KEY_ALIAS POS7_KEY_PASSWORD; do
            value="$(printenv "$key" || true)"
            if [[ -z "$value" ]]; then
              echo "Missing GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
          printf '%s' "$POS7_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          keytool -list -keystore "$keyfile" -storepass "$POS7_KEYSTORE_PASSWORD" -alias "$POS7_KEY_ALIAS" >/dev/null
          expected='843ed618b18ec7a0cbb50f38984374540da016c41a8df8042bb8db19964d4495'
          actual=$(keytool -exportcert -keystore "$keyfile" -storepass "$POS7_KEYSTORE_PASSWORD" -alias "$POS7_KEY_ALIAS" | sha256sum | awk '{print $1}')
          if [[ "$actual" != "$expected" ]]; then
            echo 'The signing certificate does not match the installed POS7 phone certificate; refusing to build an incompatible update.' >&2
            exit 1
          fi
          echo "POS7_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
          echo "POS7_SIGNING_CERT_SHA256=$actual" >> "$GITHUB_ENV"

      - name: Build signed owner phone APK
        working-directory: android-project/POS7_Owner_Phone_v485.7.105_Report_Search_APK_Project
        env:
          POS7_KEYSTORE_PASSWORD: ${{ secrets.POS7_KEYSTORE_PASSWORD }}
          POS7_KEY_ALIAS: ${{ secrets.POS7_KEY_ALIAS }}
          POS7_KEY_PASSWORD: ${{ secrets.POS7_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK package, version, and signing certificate
        run: |
          set -euo pipefail
          apk='android-project/POS7_Owner_Phone_v485.7.105_Report_Search_APK_Project/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -Fq "package: name='com.sokkarzeyedeh.pos7owner' versionCode='48507105' versionName='485.7.105'"
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [[ -z "$actual" || "$actual" != "$POS7_SIGNING_CERT_SHA256" ]]; then
            echo 'The built APK signing certificate does not match the existing POS7 certificate.' >&2
            exit 1
          fi

      - name: Upload signed owner phone APK
        uses: actions/upload-artifact@v4
        with:
          name: POS7-Owner-Phone-v485.7.105-Push-Notifications-update-apk
          path: android-project/POS7_Owner_Phone_v485.7.105_Report_Search_APK_Project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
