name: POS7 R290 Key Proof Test ONLY
on:
  push:
    branches: [pos7-r285-audit-only]
    paths:
      - 'pos7-release-audit/r290/**'
      - '.github/workflows/pos7-r290-keyproof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify signed challenge policy on JVM, no APK build
        run: |
          set -euo pipefail
          mkdir -p /tmp/pos7-r290-classes
          javac -d /tmp/pos7-r290-classes pos7-release-audit/r290/*.java
          java -cp /tmp/pos7-r290-classes com.sokkarzeyedeh.pos7.DeviceChallengeContractTest
