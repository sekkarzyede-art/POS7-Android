          assert b'jdcolkgzwqpwbfvcrdje' in result and b'rmskuolsiqbzxuakofpb' not in result
          assert b'POS7_R344_productHeld' in result and b'POS7R367Txn' in result and b'pos367OpenSavedVouchers' in result
          p.write_bytes(result)
          PY
          node pos7-release-audit/r367/test.cjs r321-android/tab1/POS7_Tablet/app/src/main/assets/index.html
          sed -i 's/485.7.229-r344-tab1/485.7.229-r367-tab1/g' r321-android/tab1/POS7_Tablet/app/build.gradle
      - name: Apply verified R368 return receipt and cancel-edit patch
