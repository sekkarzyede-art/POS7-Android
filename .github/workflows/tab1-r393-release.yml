          assert hashlib.sha256(result).hexdigest()=='ba45559b4b00e10307ce754e29ec45f64a826d1e80b372b10b4ddefb6715c0f5'
          assert b'jdcolkgzwqpwbfvcrdje' in result and b'rmskuolsiqbzxuakofpb' not in result
