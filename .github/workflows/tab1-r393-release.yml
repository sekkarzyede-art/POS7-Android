          old='try { MainActivity.this.startActivity(android.content.Intent.createChooser(send,"مشاركة صورة الفاتورة")); }'
          new='try { android.widget.Toast.makeText(context,"واتساب غير مثبت على هذا الجهاز",android.widget.Toast.LENGTH_LONG).show(); }'
