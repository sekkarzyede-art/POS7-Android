<script id="pos7-r375-tabs-ui">
(function(){'use strict';
function mount(){const sales=document.getElementById('sales'),head=sales?.querySelector('.pos7-sale-heading'),tabs=document.getElementById('pos173Baskets'),title=document.getElementById('saleTitle'),rail=document.getElementById('pos192Rail');if(!sales||!head||!tabs||!title||!rail||document.getElementById('r375SaleTop'))return;
const top=document.createElement('div');top.id='r375SaleTop';const quick=document.createElement('button');quick.id='r375QuickOpen';quick.type='button';quick.textContent='⚡ فتح البيع السريع';quick.setAttribute('aria-expanded','false');head.before(top);top.append(tabs,title,quick);
function compactClose(){for(const b of tabs.querySelectorAll('.pos178-close'))if(b.textContent!=='×')b.textContent='×';}new MutationObserver(compactClose).observe(tabs,{childList:true,subtree:true});compactClose();
function setQuick(open){if(open){sales.classList.add('r375-quick-open');if(rail.classList.contains('pos192-collapsed'))document.getElementById('pos192Toggle')?.click();const drawer=document.getElementById('pos192Drawer');if(!drawer?.classList.contains('pos192-open'))rail.querySelector('#pos192Groups [data-group]')?.click();}else{document.getElementById('pos192Close')?.click();sales.classList.remove('r375-quick-open');}quick.setAttribute('aria-expanded',String(open));quick.textContent=open?'⚡ إخفاء البيع السريع':'⚡ فتح البيع السريع';}
quick.addEventListener('click',()=>{if(document.body.classList.contains('pos203-sale-haseb-visible'))return;setQuick(!sales.classList.contains('r375-quick-open'));});
new MutationObserver(()=>{if(!sales.classList.contains('active')&&sales.classList.contains('r375-quick-open'))setQuick(false);}).observe(sales,{attributes:true,attributeFilter:['class']});
sales.classList.add('r375-ready');}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount,{once:true});else mount();
})();
</script>
